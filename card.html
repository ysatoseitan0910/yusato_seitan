:root {

  --text-light: #9aaca3;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Klee One','Noto Sans JP',sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; padding-top: var(--nav-h); }

/* ── Nav ── */
nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(253,252,247,0.95); backdrop-filter: blur(10px); border-bottom: 2px dotted var(--emerald-light); z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }

.nav-logo-mark { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 3px 0 var(--emerald-dark); transform: rotate(-4deg); flex-shrink: 0; }
.nav-logo-main { font-weight: 600; color: var(--emerald-dark); font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
.nav-links { display: flex; gap: 0; align-items: center; }
.nav-links a { text-decoration: none; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-radius: 99px; transition: all 0.15s; white-space: nowrap; }
.nav-links a:hover, .nav-links a.active { background: var(--pink-pale); color: var(--emerald-dark); }
.nav-sep { display: inline-flex; width: 1px; height: 14px; background: var(--border); margin: 0 6px; align-self: center; flex-shrink: 0; }
.nav-committee-label { display: none; }
.hamburger { display: none; background: none; border: none; cursor: pointer; font-size: 22px; color: var(--emerald-dark); padding: 4px 8px; line-height: 1; border-radius: 6px; }
.hamburger:hover { background: var(--pink-pale); }

/* ── Editor layout ── */
.editor-page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
.editor-heading { margin-bottom: 24px; }
.editor-heading h1 { font-size: 22px; font-weight: 600; color: var(--emerald-dark); }
.editor-heading p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* Template tabs */
.tpl-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tpl-tab { padding: 8px 20px; border: 2px solid var(--border); border-radius: 99px; background: var(--white); font-family: 'Klee One',serif; font-size: 14px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
.tpl-tab:hover { border-color: var(--emerald); color: var(--emerald-dark); }
.tpl-tab.active { border-color: var(--emerald); background: var(--emerald); color: #fff; box-shadow: 2px 2px 0 var(--emerald-dark); }

/* Two-column layout */
.editor-body { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }

/* Canvas area */
.canvas-wrap { position: sticky; top: calc(var(--nav-h) + 12px); background: var(--white); border: 2px solid var(--ink); border-radius: 16px; padding: 16px; box-shadow: 4px 4px 0 var(--emerald-dark); }

.controls { background: var(--white); border: 2px solid var(--ink); border-radius: 16px; padding: 22px; box-shadow: 4px 4px 0 var(--emerald); display: flex; flex-direction: column; gap: 16px; }

.field-input, .field-ta, .field-select {

.field-select { cursor: pointer; }

// ── roundRect ポリフィル ─────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y); this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r); this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h); this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r); this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
  };
}

function tplKey(tpl, id) { return `${tpl.id}__${id}`; }
function getVal(tpl, id) {

  if (key in values) return values[key];

// ── テキスト折り返し ─────────────────────────────────────
function wrapText(ctx, text, maxW) {
  const lines = [];
  for (const raw of (text || "").split("\n")) {
    if (!raw) { lines.push(""); continue; }
    let line = "";
    for (const ch of raw) {
      if (ctx.measureText(line + ch).width > maxW && line.length > 0) {
        lines.push(line); line = ch;
      } else { line += ch; }
    }
    if (line) lines.push(line);
  }
  return lines;
}

// ── アイコン円形描画 ────────────────────────────────────
function drawIconCircle(ctx, img, cx, cy, r, borderColor, borderW) {
  if (img) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sc = Math.max((r*2)/iw, (r*2)/ih);
    const sw = (r*2)/sc, sh = (r*2)/sc;
    ctx.drawImage(img, (iw-sw)/2, (ih-sh)/2, sw, sh, cx-r, cy-r, r*2, r*2);
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#ecf7f0"; ctx.fill();
    ctx.font = `${Math.round(r*0.55)}px 'Klee One',serif`;
    ctx.fillStyle = "#3DAA78"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("ゆ", cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = borderColor || "rgba(255,255,255,0.85)";
  ctx.lineWidth = borderW || 5; ctx.stroke();
}

function buildSelfIntroText(getV) {
  const birthYear = (getV("birth-year") || "").trim();
  const birthMd   = (getV("birth-md")   || "").trim();
  const gender    =  getV("gender")  || "";
  const mbti      =  getV("mbti")    || "";
  const history   = (getV("ohisama-history") || "").trim();
  const nickname  = (getV("nickname")        || "").trim();
  const free      = (getV("self-intro")      || "").trim();

  const genderVal = (gender && gender !== "無回答")    ? gender : "";
  const mbtiVal   = (mbti   && mbti   !== "わからない") ? mbti   : "";
  const birthStr  = [birthYear, birthMd].filter(Boolean).join("");

  const sentences = [];

  if (birthStr || genderVal || mbtiVal) {
    let s = "";
    if (birthStr || genderVal) {
      s = "私は";
      if (birthStr) s += `「${birthStr}」生まれ`;
      if (genderVal) s += (birthStr ? "の" : "") + `「${genderVal}」`;
      if (mbtiVal) s += `で、MBTIは「${mbtiVal}」`;
    } else {
      s = `MBTIは「${mbtiVal}」`;
    }
    sentences.push(s + "。");
  }

  if (history)  sentences.push(`おひさまになったのは「${history}」からだよ。`);
  if (nickname) sentences.push(`みんなには「${nickname}」って呼ばれてるよ。`);
  if (free)     sentences.push(free);

  return sentences.join("");
}

function buildOshiIntroText(getV) {
  const name    = (getV("oshi-name")    || "").trim();
  const reason  = (getV("oshi-reason")  || "").trim();
  const like    = (getV("oshi-like")    || "").trim();
  const episode = (getV("oshi-episode") || "").trim();
  const feeling = (getV("oshi-feeling") || "").trim();
  const love    = (getV("oshi-love")    || "").trim();

  const n = name || "彼女";
  const lines = [];

  lines.push(`日向坂の一押しはもちろん「${n}」だよ。`);

  if (reason || like) {
    let s = "";
    if (reason && like) {
      s = `「${n}」を好きになったのは「${reason}」で、「${like}」な「${n}」が大好き！`;
    } else if (reason) {
      s = `「${n}」を好きになったのは「${reason}」からで、「${n}」が大好き！`;
    } else {
      s = `「${like}」な「${n}」が大好き！`;
    }
    lines.push(s);
  }

  if (episode || feeling) {
    let s = "特に";
    s += episode ? `「${episode}」の「${n}」が` : `「${n}」が`;
    s += feeling ? `「${feeling}」！` : "最高！";
    lines.push(s);
  }

  if (love) lines.push(love);

  return lines.join("\n");
}

// ════════════════════════════════════════════════════════
//  共通描画ヘルパー
// ════════════════════════════════════════════════════════
function f(sz, bold, fam) {
  return `${bold ? "600 " : ""}${sz}px '${fam || "Klee One"}','Noto Sans JP',sans-serif`;
}

function measureBlock(ctx, text, maxW, fs, lhM) {
  ctx.font = f(fs || 15);
  const lh = Math.ceil((fs || 15) * (lhM || 1.65));
  const ls = wrapText(ctx, text || "", maxW);
  return Math.max(ls.length, 1) * lh;
}

function drawBlock(ctx, text, x, y, maxW, fs, color, lhM) {
  const lh = Math.ceil((fs || 15) * (lhM || 1.65));
  ctx.font = f(fs || 15);
  ctx.fillStyle = color || "#283a30";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const ls = wrapText(ctx, text || "", maxW);
  for (const l of ls) { ctx.fillText(l, x, y); y += lh; }
  return y;
}

// ════════════════════════════════════════════════════════
//  ノート見開き
// ════════════════════════════════════════════════════════
function drawNotebook(ctx, w, getV, ico, measureOnly) {
  const BIND = 30, PW = Math.floor((w - BIND) / 2);
  const PAD = 20, IW = PW - PAD * 2;
  const FS = 15, LH = Math.ceil(FS * 1.68);
  const C = {
    cream:"#fffdf7", line:"#e8ece6", mline:"#f5ccd8",
    mintDark:"#1f7a52", pinkDeep:"#c84a72",
    ink:"#283a30", muted:"#6b7c72", bind:"#d4c9a0",
  };

  const fanName  = getV("fan-name") || "ファン名";
  const handle   = (getV("handle") || "").trim();
  const selfText = buildSelfIntroText(getV);
  const oshiText = buildOshiIntroText(getV);

  const ICO_R = 34;
  const nameH = measureBlock(ctx, fanName, IW - ICO_R*2 - 14, 17, 1.5);
  const profileRowH = Math.max(ICO_R*2, nameH + (handle ? Math.ceil(13*1.5) + 4 : 0)) + 8;
  const selfH  = measureBlock(ctx, selfText, IW, FS);
  const oshiH  = measureBlock(ctx, oshiText, IW, FS);

  const leftH  = PAD + profileRowH + 22 + selfH  + PAD + 18;
  const rightH = PAD + 22           + 10 + oshiH  + PAD + 18;
  const totalH = Math.max(leftH, rightH);

  if (measureOnly) return totalH;

  function drawRuled(ox, w2) {
    ctx.fillStyle = C.cream; ctx.fillRect(ox, 0, w2, totalH);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (let y = 30; y < totalH; y += 30) {
      ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + w2, y); ctx.stroke();
    }
    ctx.strokeStyle = C.mline; ctx.lineWidth = 1.5;
    const mx = ox + 44;
    ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, totalH); ctx.stroke();
  }

  // Left page
  drawRuled(0, PW);
  const infoX = PAD + ICO_R*2 + 14;
  const infoW = IW - ICO_R*2 - 14;
  const icoCY = PAD + profileRowH/2;
  drawIconCircle(ctx, ico, PAD + ICO_R, icoCY, ICO_R, "#f7b6c8", 4);

  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const nls = wrapText(ctx, fanName, infoW);
  ctx.font = f(17, true);
  const nLH = Math.ceil(17*1.5);
  const totalNameH = nls.length * nLH + (handle ? Math.ceil(13*1.5) + 4 : 0);
  let ny = icoCY - totalNameH/2;
  ctx.fillStyle = C.ink;
  for (const l of nls) { ctx.fillText(l, infoX, ny); ny += nLH; }
  if (handle) {
    ctx.font = f(13); ctx.fillStyle = C.muted;
    ctx.fillText(handle.startsWith("@") ? handle : "@" + handle, infoX, ny + 2);
  }

  let lY = PAD + profileRowH + 10;
  ctx.font = f(12, true); ctx.fillStyle = C.mintDark;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("── 自己紹介 ──", PAD, lY); lY += 20 + 6;
  drawBlock(ctx, selfText, PAD, lY, IW, FS, C.ink);

  // Right page
  const RX = PW + BIND;
  drawRuled(RX, PW);
  let rY = PAD;
  ctx.font = f(12, true); ctx.fillStyle = C.pinkDeep;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("── 推し紹介 ──", RX + PAD, rY); rY += 20 + 6;
  drawBlock(ctx, oshiText, RX + PAD, rY, IW, FS, C.ink);

  // Footer
  ctx.font = f(11); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("♡ satoyu.info  #さとうゆおしプロフィール ♡", PW/2, totalH - 5);
  ctx.fillText("♡ satoyu.info  #さとうゆおしプロフィール ♡", RX + PW/2, totalH - 5);

  // Binding
  ctx.fillStyle = "rgba(0,0,0,0.04)"; ctx.fillRect(PW, 0, BIND, totalH);
  const ringX = PW + BIND/2, numR = Math.max(3, Math.floor(totalH/60));
  for (let i = 0; i < numR; i++) {
    const ry = 30 + i * Math.floor((totalH - 40) / Math.max(numR-1, 1));
    ctx.beginPath(); ctx.arc(ringX, ry, 7, 0, Math.PI*2);
    ctx.fillStyle = C.cream; ctx.fill();
    ctx.strokeStyle = C.bind; ctx.lineWidth = 1.5; ctx.stroke();
  }

  return totalH;
}

// ════════════════════════════════════════════════════════
//  プロフィール帳
// ════════════════════════════════════════════════════════
function drawBooklet(ctx, w, getV, ico, measureOnly) {
  const PAD = 22, IW = w - PAD*2;
  const FS = 15, LH = Math.ceil(FS * 1.65);
  const C = {
    mintDark:"#1f7a52", mint:"#3DAA78", mintPale:"#eaf6ee",
    pinkDeep:"#c84a72", pinkPale:"#fdeef3",
    ink:"#283a30", muted:"#6b7c72", white:"#fff", bg:"#fffdf8",
  };

  const fanName  = getV("fan-name") || "ファン名";
  const handle   = (getV("handle") || "").trim();
  const selfText = buildSelfIntroText(getV);
  const oshiText = buildOshiIntroText(getV);

  // Header
  const HDR_H = 110;

  // Self section
  const SPAD = 16;
  const selfH = measureBlock(ctx, selfText, IW - SPAD*2, FS) + SPAD*2 + 28 + 10;

  // Oshi section
  const oshiH = measureBlock(ctx, oshiText, IW - SPAD*2, FS) + SPAD*2 + 28 + 10;

  const FTR_H = 32;
  const totalH = HDR_H + selfH + 10 + oshiH + FTR_H;

  if (measureOnly) return totalH;

  // Background
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, totalH);

  // Header gradient
  const g = ctx.createLinearGradient(0, 0, w, HDR_H);
  g.addColorStop(0, C.mintDark); g.addColorStop(1, C.mint);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, HDR_H);

  // Decorative circles
  ctx.beginPath(); ctx.arc(w - 30, -10, 110, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill();

  // Icon
  const ICO_R = 36, ICO_CX = PAD + ICO_R, ICO_CY = HDR_H/2;
  drawIconCircle(ctx, ico, ICO_CX, ICO_CY, ICO_R, "#fff", 4);

  // Fan name + handle
  const infoX = ICO_CX + ICO_R + 16;
  const infoW = w - infoX - PAD;
  const nls = wrapText(ctx, fanName, infoW);
  ctx.font = f(20, true); ctx.fillStyle = "#fff";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const nLH = Math.ceil(20*1.5);
  let ny = ICO_CY - (nls.length * nLH + (handle ? 20 : 0)) / 2;
  for (const l of nls) { ctx.fillText(l, infoX, ny); ny += nLH; }
  if (handle) {
    ctx.font = f(13); ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(handle.startsWith("@") ? handle : "@" + handle, infoX, ny + 2);
  }

  // Self section
  let sY = HDR_H + 10;
  ctx.fillStyle = C.mintPale; ctx.fillRect(PAD, sY, IW, selfH);
  ctx.strokeStyle = C.mint; ctx.lineWidth = 1.5;
  ctx.strokeRect(PAD, sY, IW, selfH);

  // Self label pill
  ctx.font = f(12, true);
  const slW = ctx.measureText("自己紹介").width + 24;
  ctx.beginPath(); ctx.roundRect(PAD + SPAD, sY + SPAD, slW, 22, 99);
  ctx.fillStyle = C.mint; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("自己紹介", PAD + SPAD + 12, sY + SPAD + 11);

  drawBlock(ctx, selfText, PAD + SPAD, sY + SPAD + 28 + 4, IW - SPAD*2, FS, C.ink);

  // Oshi section
  let oY = sY + selfH + 10;
  ctx.fillStyle = C.pinkPale; ctx.fillRect(PAD, oY, IW, oshiH);
  ctx.strokeStyle = "#e895b3"; ctx.lineWidth = 1.5;
  ctx.strokeRect(PAD, oY, IW, oshiH);

  // Oshi label pill
  ctx.font = f(12, true);
  const olW = ctx.measureText("推し紹介").width + 24;
  ctx.beginPath(); ctx.roundRect(PAD + SPAD, oY + SPAD, olW, 22, 99);
  ctx.fillStyle = C.pinkDeep; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("推し紹介", PAD + SPAD + 12, oY + SPAD + 11);

  drawBlock(ctx, oshiText, PAD + SPAD, oY + SPAD + 28 + 4, IW - SPAD*2, FS, C.ink);

  // Footer
  ctx.font = f(11); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("♡ satoyu.info  #さとうゆおしプロフィール ♡", w/2, oY + oshiH + FTR_H/2);

  return totalH;
}

// ════════════════════════════════════════════════════════
//  ステッカー帳
// ════════════════════════════════════════════════════════
function drawStickerSheet(ctx, w, getV, ico, measureOnly) {
  const PAD = 16, GAP = 12;
  const IW = w - PAD*2;
  const FS = 15, LH = Math.ceil(FS * 1.65);
  const C = {
    cream:"#fffcf0", lineDark:"#e0d8c8",
    mintDark:"#1f7a52", mint:"#3DAA78", mintPale:"#e8f7ee",
    pinkDeep:"#c84a72", pinkPale:"#fce8f0",
    ink:"#283a30", muted:"#6b7c72", white:"#fff",
  };

  const fanName  = getV("fan-name") || "ファン名";
  const handle   = (getV("handle") || "").trim();
  const selfText = buildSelfIntroText(getV);
  const oshiText = buildOshiIntroText(getV);

  const SPAD = 14;
  const HDR_H = 72;
  const selfH = measureBlock(ctx, selfText, IW - SPAD*2 - 4, FS) + SPAD*2 + 30;
  const oshiH = measureBlock(ctx, oshiText, IW - SPAD*2 - 4, FS) + SPAD*2 + 30;
  const totalH = HDR_H + PAD + selfH + GAP + oshiH + PAD + 20;

  if (measureOnly) return totalH;

  // Background
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, w, totalH);
  // Horizontal rules
  ctx.strokeStyle = C.lineDark; ctx.lineWidth = 0.8;
  for (let y = 28; y < totalH; y += 28) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  // Left border strip
  ctx.fillStyle = C.mint; ctx.fillRect(0, 0, 5, totalH);

  // Header
  const ICO_R = 26;
  drawIconCircle(ctx, ico, PAD + ICO_R, HDR_H/2, ICO_R, "#fff", 3);
  const hTX = PAD + ICO_R*2 + 12;
  ctx.font = f(30, true, "Caveat"); ctx.fillStyle = C.mintDark;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("さとうゆ fan profile ♡", hTX, HDR_H/2 - 10);
  if (fanName) {
    ctx.font = f(14); ctx.fillStyle = C.muted;
    const hn = handle ? `${fanName}（${handle.startsWith("@") ? handle : "@"+handle}）` : fanName;
    ctx.fillText(hn, hTX, HDR_H/2 + 16);
  }

  // Self block
  let bY = HDR_H + PAD;
  ctx.fillStyle = C.mintPale; ctx.beginPath(); ctx.roundRect(PAD, bY, IW, selfH, 12); ctx.fill();
  ctx.strokeStyle = C.mint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(PAD, bY, IW, selfH, 12); ctx.stroke();
  // Left accent bar
  ctx.fillStyle = C.mint; ctx.beginPath(); ctx.roundRect(PAD, bY, 5, selfH, [12,0,0,12]); ctx.fill();
  ctx.font = f(12, true); ctx.fillStyle = C.mintDark;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("✦ 自己紹介", PAD + SPAD, bY + SPAD - 2);
  drawBlock(ctx, selfText, PAD + SPAD, bY + SPAD + 22, IW - SPAD*2, FS, C.ink);

  // Oshi block
  let oY = bY + selfH + GAP;
  ctx.fillStyle = C.pinkPale; ctx.beginPath(); ctx.roundRect(PAD, oY, IW, oshiH, 12); ctx.fill();
  ctx.strokeStyle = "#e895b3"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(PAD, oY, IW, oshiH, 12); ctx.stroke();
  // Left accent bar
  ctx.fillStyle = C.pinkDeep; ctx.beginPath(); ctx.roundRect(PAD, oY, 5, oshiH, [12,0,0,12]); ctx.fill();
  ctx.font = f(12, true); ctx.fillStyle = C.pinkDeep;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("♡ 推し紹介", PAD + SPAD, oY + SPAD - 2);
  drawBlock(ctx, oshiText, PAD + SPAD, oY + SPAD + 22, IW - SPAD*2, FS, C.ink);

  // Footer
  ctx.font = f(11); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("♡ satoyu.info  #さとうゆおしプロフィール ♡", w/2, totalH - 4);

  return totalH;
}

// ════════════════════════════════════════════════════════
//  描画ディスパッチ
// ════════════════════════════════════════════════════════
const DRAW_FNS = {
  notebook: drawNotebook,
  booklet:  drawBooklet,
  sticker:  drawStickerSheet,
};

function render() {
  const tpl  = TEMPLATES[tplIdx];
  const draw = DRAW_FNS[tpl.id];
  canvas.width = tpl.w;
  canvas.height = 9999;
  const totalH = draw(ctx, tpl.w, id => getVal(tpl, id), iconImg, true);
  canvas.height = totalH;
  currentCanvasH = totalH;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, tpl.w, totalH);
  draw(ctx, tpl.w, id => getVal(tpl, id), iconImg, false);
  document.getElementById("canvas-size-note").textContent = `出力サイズ: ${tpl.w} × ${totalH} px`;
}

// ════════════════════════════════════════════════════════
//  UI 生成
// ════════════════════════════════════════════════════════
function buildTabs() {
  const container = document.getElementById("tpl-tabs");
  container.innerHTML = "";
  TEMPLATES.forEach((tpl, i) => {
    const btn = document.createElement("button");
    btn.className = "tpl-tab" + (i === tplIdx ? " active" : "");
    btn.textContent = tpl.name;
    btn.onclick = () => switchTemplate(i);
    container.appendChild(btn);
  });
}

function buildFields() {
  const tpl = TEMPLATES[tplIdx];
  const container = document.getElementById("fields-list");
  container.innerHTML = "";

  tpl.fields.forEach(f => {
    // Section divider
    if (f.sectionStart) {
      const div = document.createElement("hr");
      div.className = "field-divider";
      container.appendChild(div);
      const lbl = document.createElement("span");
      lbl.className = "form-section-label pink";
      lbl.textContent = f.sectionStart;
      container.appendChild(lbl);
    }

    const block = document.createElement("div");
    block.className = "field-block";
    block.dataset.fieldId = f.id;

    const labelEl = document.createElement("label");
    labelEl.className = "field-label";
    labelEl.textContent = f.label + (f.required ? " *" : "");

    block.appendChild(labelEl);

    if (f.type === "radio") {
      const group = document.createElement("div");
      group.className = "field-radio-group";
      const currentVal = getVal(tpl, f.id);
      f.options.forEach(opt => {
        const lbl = document.createElement("label");
        lbl.className = "field-radio" + (currentVal === opt ? " selected" : "");
        const inp = document.createElement("input");
        inp.type = "radio";
        inp.name = `${tpl.id}-${f.id}`;
        inp.value = opt;
        if (currentVal === opt) inp.checked = true;
        inp.addEventListener("change", () => {
          group.querySelectorAll(".field-radio").forEach(l => l.classList.remove("selected"));
          lbl.classList.add("selected");
          setVal(tpl, f.id, opt);
          render();
        });
        lbl.appendChild(inp);
        lbl.appendChild(document.createTextNode(opt));
        group.appendChild(lbl);
      });
      block.appendChild(group);

    } else if (f.type === "select") {
      const sel = document.createElement("select");
      sel.className = "field-select";
      const currentVal = getVal(tpl, f.id);
      f.options.forEach(opt => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        if (opt === currentVal) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", e => { setVal(tpl, f.id, e.target.value); render(); });
      block.appendChild(sel);

    } else {
      const el = f.multiline ? document.createElement("textarea") : document.createElement("input");
      el.className = f.multiline ? "field-ta" : "field-input";
      el.placeholder = f.placeholder || "";
      el.value = getVal(tpl, f.id);
      if (!f.multiline) el.type = "text";
      el.addEventListener("input", e => { setVal(tpl, f.id, e.target.value); render(); });
      block.appendChild(el);
    }

    container.appendChild(block);
  });
}

function switchTemplate(idx) {
  tplIdx = idx;
  document.querySelectorAll(".tpl-tab").forEach((b, i) => b.classList.toggle("active", i === idx));
  buildFields();
  render();
}

// ── アイコン画像アップロード ──────────────────────────────
function initIconUpload() {
  const fileInput = document.getElementById("icon-file");
  const preview   = document.getElementById("icon-preview");
  const thumbWrap = document.getElementById("icon-thumb-wrap");
  const clearBtn  = document.getElementById("icon-clear-btn");

  fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        iconImg = img;
        preview.src = e.target.result;
        thumbWrap.classList.add("has-icon");
        clearBtn.style.display = "inline-block";
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    this.value = "";
  });

  clearBtn.addEventListener("click", function () {
    iconImg = null;
    preview.src = "";
    thumbWrap.classList.remove("has-icon");
    clearBtn.style.display = "none";
    render();
  });
}

// ── 高解像度 Canvas 生成 ────────────────────────────────
function buildHighResCanvas() {
  const tpl   = TEMPLATES[tplIdx];
  const SCALE = 2;
  const draw  = DRAW_FNS[tpl.id];
  const getV  = id => getVal(tpl, id);

  const tmp = document.createElement("canvas");
  const tc  = tmp.getContext("2d");
  tmp.width  = tpl.w * SCALE;
  tmp.height = 9999;
  tc.scale(SCALE, SCALE);
  const totalH = draw(tc, tpl.w, getV, iconImg, true);

  tmp.height = totalH * SCALE;
  tc.scale(SCALE, SCALE);
  tc.fillStyle = "#ffffff";
  tc.fillRect(0, 0, tpl.w, totalH);
  draw(tc, tpl.w, getV, iconImg, false);

  const name = (getVal(tpl, "fan-name") || "card").replace(/[\s　]/g, "_");
  return { canvas: tmp, filename: `satoyu_profile_${name}.png` };
}

function download() {
  const { canvas, filename } = buildHighResCanvas();
  const a = document.createElement("a");
  a.download = filename;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

const TWEET_TEXT = "#さとうゆおしプロフィール\nhttps://satoyu.info";

async function shareToX() {
  const btn = document.getElementById("share-x-btn");
  btn.disabled = true;
  btn.textContent = "⏳ 準備中...";
  try {
    const { canvas, filename } = buildHighResCanvas();

    if (navigator.canShare) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      const file = new File([blob], filename, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ text: TWEET_TEXT, files: [file] });
          return;
        } catch (e) {
          if (e.name === "AbortError") return;
        }
      }
    }

    const a = document.createElement("a");
    a.download = filename;
    a.href = canvas.toDataURL("image/png");
    a.click();
    const xUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(TWEET_TEXT);
    setTimeout(() => window.open(xUrl, "_blank", "width=600,height=500,noopener"), 600);
  } finally {
    btn.disabled = false;
    btn.textContent = "𝕏 Xに投稿する";
  }
}

// ── 初期化 ─────────────────────────────────────────────
document.fonts.ready.then(() => {
  buildTabs();
  switchTemplate(0);
  document.getElementById("download-btn").addEventListener("click", download);
  document.getElementById("share-x-btn").addEventListener("click", shareToX);
  initIconUpload();
});

// ════════════════════════════════════════════════════════
//  Canvas クリック → フォームフィールドへスクロール
// ════════════════════════════════════════════════════════
const SELF_FIELD_IDS = ["fan-name","handle","birth-year","birth-md","gender","mbti","ohisama-history","nickname","self-intro"];
const OSHI_FIELD_IDS = ["oshi-name","oshi-reason","oshi-like","oshi-episode","oshi-feeling","oshi-love"];

function getClickedSection(cx, cy) {
  const tpl = TEMPLATES[tplIdx];
  if (tpl.id === "notebook") {
    // 左ページ = 自己紹介、右ページ = 推し紹介
    return cx < tpl.w * 0.46 ? "self" : "oshi";
  } else {
    // booklet / sticker: 上半分 = 自己紹介、下半分 = 推し紹介
    return cy < currentCanvasH * 0.52 ? "self" : "oshi";
  }
}

function flashCanvasZone(cx, cy) {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = rect.width  / canvas.width;
  const scaleY = rect.height / canvas.height;
  const tpl   = TEMPLATES[tplIdx];
  const canvasLeft = canvas.offsetLeft + 1; // +1 for border

  let fx, fy, fw, fh;
  if (tpl.id === "notebook") {
    if (cx < tpl.w * 0.46) {
      fx = canvasLeft; fw = rect.width * 0.46;
    } else {
      fx = canvasLeft + rect.width * 0.52; fw = rect.width * 0.47;
    }
    fy = canvas.offsetTop; fh = rect.height;
  } else {
    fx = canvasLeft; fw = rect.width;
    if (cy < currentCanvasH * 0.52) {
      fy = canvas.offsetTop; fh = rect.height * 0.52;
    } else {
      fy = canvas.offsetTop + rect.height * 0.52; fh = rect.height * 0.48;
    }
  }

  const overlay = document.createElement("div");
  overlay.className = "canvas-flash-overlay";
  overlay.style.cssText = `left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px;opacity:1;`;
  canvas.parentElement.appendChild(overlay);
  requestAnimationFrame(() => { overlay.style.opacity = "0"; });
  setTimeout(() => overlay.remove(), 450);
}

function scrollToSection(section) {
  const container = document.getElementById("fields-list");
  const ids = section === "self" ? SELF_FIELD_IDS : OSHI_FIELD_IDS;
  let scrollTarget = null;

  for (const id of ids) {
    const block = container.querySelector(`[data-field-id="${id}"]`);
    if (!block) continue;
    block.classList.remove("highlight-flash");
    void block.offsetWidth; // force reflow to restart animation
    block.classList.add("highlight-flash");
    if (!scrollTarget) scrollTarget = block;
  }

  if (scrollTarget) {
    scrollTarget.scrollIntoView({ behavior: "smooth", block: "nearest" });
    // Focus the first input/textarea in the section
    const firstInput = scrollTarget.querySelector("input[type=text],textarea,select");
    if (firstInput) setTimeout(() => firstInput.focus(), 300);
  }
}

canvas.addEventListener("click", function (e) {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top)  * scaleY;
  const section = getClickedSection(cx, cy);
  flashCanvasZone(cx, cy);
  scrollToSection(section);
});

// ── ハンバーガーメニュー ──────────────────────────────
(function () {
  const btn   = document.getElementById("hamburger");
  const links = document.getElementById("nav-links");
  if (!btn || !links) return;
  btn.addEventListener("click", function () {
    const open = links.classList.toggle("open");
    btn.textContent = open ? "✕" : "☰";
    btn.setAttribute("aria-label", open ? "メニューを閉じる" : "メニューを開く");
  });
  links.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", function () {
      links.classList.remove("open");
      btn.textContent = "☰";
      btn.setAttribute("aria-label", "メニューを開く");
    });
  });
})();
</script>
