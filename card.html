<style>
:root {
  --emerald: #3DAA78;
  --emerald-dark: #1f7a52;
  --emerald-light: #d4ecde;
  --emerald-pale: #ecf7f0;
  --pink: #f7b6c8;
  --pink-pale: #fde7ed;
  --ink: #1a2a22;
  --text-muted: #516259;
  --text-light: #9aaca3;
  --border: #e3eee6;
  --bg: #fdfcf7;
  --white: #fff;
  --nav-h: 60px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Klee One', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-top: var(--nav-h);
}

/* ── Nav ── */
nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(253,252,247,0.95); backdrop-filter: blur(10px); border-bottom: 2px dotted var(--emerald-light); z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-mark { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 3px 0 var(--emerald-dark); transform: rotate(-4deg); flex-shrink: 0; }
.nav-logo-main { font-weight: 600; color: var(--emerald-dark); font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
.nav-links { display: flex; gap: 0; align-items: center; }
.nav-links a { text-decoration: none; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-radius: 99px; transition: all 0.15s; white-space: nowrap; }
.nav-links a:hover, .nav-links a.active { background: var(--pink-pale); color: var(--emerald-dark); }
.nav-sep { display: inline-flex; width: 1px; height: 14px; background: var(--border); margin: 0 6px; align-self: center; flex-shrink: 0; }
.nav-committee-label { display: none; }
.hamburger { display: none; background: none; border: none; cursor: pointer; font-size: 22px; color: var(--emerald-dark); padding: 4px 8px; line-height: 1; border-radius: 6px; }
.hamburger:hover { background: var(--pink-pale); }

/* ── Editor layout ── */
.editor-page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
.editor-heading { margin-bottom: 24px; }
.editor-heading h1 { font-size: 22px; font-weight: 600; color: var(--emerald-dark); }
.editor-heading p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* Template tabs */
.tpl-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tpl-tab {
  padding: 8px 20px; border: 2px solid var(--border); border-radius: 99px;
  background: var(--white); font-family: 'Klee One', serif; font-size: 14px;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.tpl-tab:hover { border-color: var(--emerald); color: var(--emerald-dark); }
.tpl-tab.active { border-color: var(--emerald); background: var(--emerald); color: #fff; box-shadow: 2px 2px 0 var(--emerald-dark); }

/* Two-column layout */
.editor-body { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }

/* Canvas area */
.canvas-wrap {
  position: sticky; top: calc(var(--nav-h) + 12px);
  background: var(--white); border: 2px solid var(--ink); border-radius: 16px;
  padding: 16px; box-shadow: 4px 4px 0 var(--emerald-dark);
}
.canvas-label { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.06em; }
#preview-canvas {
  width: 100%; height: auto; display: block;
  border-radius: 8px; border: 1px solid var(--border);
}
.canvas-size-note { font-size: 11px; color: var(--text-light); margin-top: 8px; text-align: right; }

/* Controls */
.controls {
  background: var(--white); border: 2px solid var(--ink); border-radius: 16px;
  padding: 22px; box-shadow: 4px 4px 0 var(--emerald);
  display: flex; flex-direction: column; gap: 18px;
}
.controls-title { font-size: 15px; font-weight: 600; color: var(--ink); padding-bottom: 12px; border-bottom: 2px dashed var(--border); }

/* Fields */
.field-block { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.field-input, .field-ta {
  width: 100%; padding: 9px 12px;
  border: 2px solid var(--border); border-radius: 10px;
  font-family: 'Klee One', serif; font-size: 14px;
  background: var(--bg); color: var(--ink);
  transition: border-color 0.15s;
  resize: vertical;
}
.field-input:focus, .field-ta:focus { outline: none; border-color: var(--emerald); }
.field-ta { min-height: 72px; }

/* Field options (font-size, color, font) */
.field-options { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field-opt-label { font-size: 11px; color: var(--text-light); }
.field-opt-select {
  padding: 3px 8px; border: 1.5px solid var(--border); border-radius: 6px;
  font-size: 12px; font-family: inherit; background: var(--bg);
  cursor: pointer;
}
.field-opt-color {
  width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 1px; background: none;
}

/* Divider */
.field-divider { border: none; border-top: 1px dashed var(--border); }

/* Icon upload */
.icon-section { display: flex; flex-direction: column; gap: 8px; }
.icon-section-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.icon-row { display: flex; align-items: center; gap: 14px; }
.icon-thumb-wrap { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
.icon-thumb {
  width: 68px; height: 68px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border); display: none;
}
.icon-thumb-wrap.has-icon .icon-thumb { display: block; }
.icon-thumb-wrap.has-icon .icon-thumb-empty { display: none; }
.icon-thumb-empty {
  width: 68px; height: 68px; border-radius: 50%;
  border: 2px dashed var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-light);
}
.icon-btns { display: flex; flex-direction: column; gap: 6px; }
#icon-file { display: none; }
.icon-select-btn {
  padding: 7px 14px; border: 2px solid var(--emerald); border-radius: 8px;
  background: var(--emerald-pale); color: var(--emerald-dark);
  font-family: 'Klee One', serif; font-size: 13px; cursor: pointer;
  transition: all 0.15s; text-align: center; display: inline-block; white-space: nowrap;
}
.icon-select-btn:hover { background: var(--emerald-light); }
.icon-clear-btn {
  padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  background: none; color: var(--text-muted); font-family: 'Klee One', serif;
  font-size: 12px; cursor: pointer; transition: all 0.15s; display: none;
}
.icon-clear-btn:hover { border-color: #e88; color: #c44; }

/* Download */
.download-section { padding-top: 4px; }
.download-btn {
  width: 100%; padding: 13px;
  background: var(--emerald); color: #fff;
  border: 2px solid var(--ink); border-radius: 12px;
  font-family: 'Klee One', serif; font-size: 16px; font-weight: 600;
  cursor: pointer; box-shadow: 3px 3px 0 var(--emerald-dark);

.download-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--emerald-dark); }
.download-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--emerald-dark); }
.download-note { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 8px; }

/* Placeholder badge */
.placeholder-badge {

  background: #fff8e0; border: 1px solid #f0d880; border-radius: 99px;

}

/* Footer */
.foot { text-align: center; padding: 32px 16px; }
.foot p { font-size: 11px; color: var(--text-light); }

@media (max-width: 760px) {
  nav { padding: 0 16px; }
  .hamburger { display: block; }
  .nav-links { display: none; flex-direction: column; align-items: stretch; position: absolute; top: var(--nav-h); left: 0; right: 0; background: rgba(253,252,247,0.98); border-bottom: 2px dotted var(--emerald-light); padding: 8px 16px 16px; gap: 2px; z-index: 199; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 10px 14px; font-size: 13px; border-radius: 8px; }
  .nav-sep { display: none; }
  .nav-committee-label { display: block; font-size: 10px; letter-spacing: 0.06em; color: var(--text-light); padding: 10px 14px 2px; border-top: 1px dashed var(--border); margin-top: 4px; }
  .editor-body { grid-template-columns: 1fr; }
  .canvas-wrap { position: static; }
  .controls { order: -1; }
}
</style>

<script>
// ── roundRect ポリフィル（Safari 15以前対応）──────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y); this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r); this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h); this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r); this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
  };
}

// ════════════════════════════════════════════════════════
//  テンプレート定義
// ════════════════════════════════════════════════════════
const TEMPLATES = [
  {
    id: "profile-card",
    name: "ファンプロフィールカード",
    w: 900,
    customRender: true,   // drawProfileCard() を使用
    fields: [
      { id: "fan-name",   label: "ファン名",                       placeholder: "さとうゆのみ〜んな" },
      { id: "handle",     label: "X（Twitter）ID",                 placeholder: "@satoyuhome" },
      { id: "oshi-years", label: "推し歴",                         placeholder: "2023年〜 ／ ○年目" },
      { id: "reason",     label: "好きになったきっかけ",           placeholder: "ブログを読んで一目惚れしました…", multiline: true },
      { id: "top1",       label: "好きなところ・魅力 No.1",       placeholder: "笑顔" },
      { id: "top2",       label: "好きなところ・魅力 No.2",       placeholder: "表現力" },
      { id: "top3",       label: "好きなところ・魅力 No.3",       placeholder: "ブログ" },
      { id: "episode",    label: "印象に残っているエピソード",     placeholder: "〇〇のコンサートで…", multiline: true },
      { id: "recommend",  label: "おすすめコンテンツ",             placeholder: "〇〇のブログ / 〇〇の動画…", multiline: true },
      { id: "love",       label: "佐藤優羽さんへの愛を叫ぼう！", placeholder: "優羽ちゃん大好き！", multiline: true },
    ],
  },
];

// ════════════════════════════════════════════════════════
//  状態管理
// ════════════════════════════════════════════════════════
let tplIdx = 0;
const values = {};  // { templateId__fieldId: text }
let iconImg  = null;

// ════════════════════════════════════════════════════════
//  Canvas
// ════════════════════════════════════════════════════════
const canvas = document.getElementById("preview-canvas");
const ctx    = canvas.getContext("2d");

function tplKey(tpl, id) { return `${tpl.id}__${id}`; }
function getVal(tpl, id) { return values[tplKey(tpl, id)] || ""; }
function setVal(tpl, id, v) { values[tplKey(tpl, id)] = v; }

// ── テキスト折り返し（日本語対応）──────────────────────
function wrapText(ctx, text, maxW) {
  const lines = [];
  for (const raw of (text || "").split("\n")) {
    if (!raw) { lines.push(""); continue; }
    let line = "";
    for (const ch of raw) {
      if (ctx.measureText(line + ch).width > maxW && line.length > 0) {
        lines.push(line); line = ch;
      } else { line += ch; }
    }
    if (line) lines.push(line);
  }
  return lines;
}

// ── アイコン円形描画ヘルパー ────────────────────────────
function drawIconCircle(ctx, img, cx, cy, r, borderColor, borderW) {
  if (img) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sc = Math.max((r*2)/iw, (r*2)/ih);
    const sw = (r*2)/sc, sh = (r*2)/sc;
    ctx.drawImage(img, (iw-sw)/2, (ih-sh)/2, sw, sh, cx-r, cy-r, r*2, r*2);
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#ecf7f0"; ctx.fill();
    ctx.font = `${Math.round(r*0.55)}px 'Klee One', serif`;
    ctx.fillStyle = "#3DAA78"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("ゆ", cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = borderColor || "rgba(255,255,255,0.85)";
  ctx.lineWidth = borderW || 5; ctx.stroke();
}

// ════════════════════════════════════════════════════════
//  プロフィールカード 描画エンジン
// ════════════════════════════════════════════════════════
function drawProfileCard(ctx, w, getValFn, icoImg, measureOnly) {
  const PAD  = 54;
  const CW   = w - PAD * 2;
  const C = {
    emerald:     "#3DAA78",
    emeraldDark: "#1f7a52",
    emeraldPale: "#ecf7f0",
    pink:        "#f7b6c8",
    pinkDeep:    "#e05888",
    inkDark:     "#0f1e16",
    ink:         "#1a2a22",
    muted:       "#516259",
    light:       "#9aaca3",
    border:      "#d8ece0",
    bg:          "#fdfcf7",
    white:       "#ffffff",
  };

  function font(size, bold, family) {
    return `${bold?"600 ":""}${size}px '${family||"Klee One"}', 'Noto Sans JP', sans-serif`;
  }
  function lines(text, maxW, size, bold) {
    ctx.font = font(size, bold);
    return wrapText(ctx, text, maxW);
  }

  // ── HEADER ────────────────────────────────────────────
  const HDR_H = 185;
  if (!measureOnly) {
    const g = ctx.createLinearGradient(0, 0, w, HDR_H);
    g.addColorStop(0, C.emeraldDark);
    g.addColorStop(1, C.emerald);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, HDR_H);
    // 装飾円
    ctx.beginPath(); ctx.arc(w-40, -10, 150, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.05)"; ctx.fill();
    ctx.beginPath(); ctx.arc(50, HDR_H+10, 100, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.04)"; ctx.fill();
    // タイトル
    ctx.font=font(54,true,"Caveat"); ctx.fillStyle="rgba(255,255,255,0.95)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("♡ さとうゆ ♡", w/2, 85);
    ctx.font=font(20,false); ctx.fillStyle="rgba(255,255,255,0.70)";
    ctx.fillText("fan profile card", w/2, 138);
    // ハートデコ
    ctx.font="15px sans-serif"; ctx.fillStyle="rgba(255,255,255,0.35)";
    ctx.textBaseline="middle";
    ctx.fillText("♥", PAD, 165); ctx.fillText("♥", w-PAD-14, 165);
  }

  // ── PROFILE（左アイコン ／ 右テキスト）──────────────────
  const ICON_R  = 80;
  const ICON_CX = PAD + ICON_R;           // 134
  const RIGHT_X = ICON_CX + ICON_R + 24;  // 238
  const RIGHT_W = w - RIGHT_X - PAD;      // 608

  // 右側コンテンツ高さを計測して PRF_H を動的決定
  const _nameText  = getValFn("fan-name");
  const _handle    = getValFn("handle");
  const _oy        = getValFn("oshi-years");
  ctx.font = font(36, true);
  const _nameLines = wrapText(ctx, _nameText || "ファン名", RIGHT_W);
  const _nameH  = _nameLines.length * 46;
  const _hndH   = _handle   ? 32 : 0;
  const _oyH    = _oy       ? 36 : 0;
  const _contentH = _nameH + (_hndH ? _hndH + 8 : 0) + (_oyH ? _oyH + 8 : 0);
  const PRF_H = Math.max(ICON_R * 2 + 40, _contentH + 60); // 最小 200px

  const ICON_CY = HDR_H + PRF_H / 2;

  if (!measureOnly) {
    ctx.fillStyle = C.white; ctx.fillRect(0, HDR_H, w, PRF_H);

    // ── アイコン（左）
    drawIconCircle(ctx, icoImg, ICON_CX, ICON_CY, ICON_R, C.pink, 6);

    // ── 右側コンテンツ（縦中央揃え）
    let ry = ICON_CY - _contentH / 2;

    // ファン名
    ctx.font = font(36, true); ctx.fillStyle = C.inkDark;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    for (const l of _nameLines) { ctx.fillText(l, RIGHT_X, ry); ry += 46; }

    // X ID
    if (_handle) {
      ry += 6;
      ctx.font = font(20); ctx.fillStyle = C.muted;
      ctx.fillText(_handle.startsWith("@") ? _handle : `@${_handle}`, RIGHT_X, ry);
      ry += 28;
    }

    // 推し歴 pill
    if (_oy) {
      ry += 8;
      ctx.font = font(16);
      const pt = `📅 推し歴：${_oy}`;
      const pw = ctx.measureText(pt).width + 28, ph = 28;
      ctx.beginPath(); ctx.roundRect(RIGHT_X, ry, pw, ph, 99);
      ctx.fillStyle = C.emeraldPale; ctx.fill();
      ctx.strokeStyle = C.emerald; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = C.emeraldDark;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(pt, RIGHT_X + 14, ry + ph / 2);
    }

    // 下境界線
    ctx.strokeStyle = C.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, HDR_H+PRF_H); ctx.lineTo(w, HDR_H+PRF_H); ctx.stroke();
  }

  // ── SECTIONS ──────────────────────────────────────────
  let sY = HDR_H + PRF_H + 20;

  function drawLabel(y, text, color) {
    if (measureOnly) return;
    ctx.font = font(15, true);
    const lw = Math.min(ctx.measureText(text).width + 44, CW);
    ctx.beginPath(); ctx.roundRect(PAD, y, lw, 32, 99);
    ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = C.white; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(text, PAD+22, y+16);
  }

  function drawDivider(y) {
    if (measureOnly) return;
    ctx.save(); ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(w-PAD,y);
    ctx.strokeStyle=C.border; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }

  function section(labelText, labelColor, contentFn) {
    drawLabel(sY, labelText, labelColor);
    sY += 32 + 14;
    sY = contentFn(sY);
    sY += 14;
    drawDivider(sY);
    sY += 20;
  }

  function textBlock(y, text, size, color) {
    ctx.font = font(size);
    const ls = lines(text, CW-8, size);
    if (!ls.length || !ls[0]) {
      if (!measureOnly) {
        ctx.fillStyle="#ccc"; ctx.textAlign="left"; ctx.textBaseline="top";
        ctx.fillText("—", PAD+4, y);
      }
      return y + size * 1.6;
    }
    if (!measureOnly) {
      ctx.fillStyle = color || C.ink;
      ctx.textAlign="left"; ctx.textBaseline="top";
    }
    const lh = Math.round(size * 1.55);
    for (const l of ls) {
      if (!measureOnly) ctx.fillText(l, PAD+4, y);
      y += lh;
    }
    return y;
  }

  // きっかけ
  section("佐藤優羽さんを好きになったきっかけ", C.emerald, (y) =>
    textBlock(y, getValFn("reason"), 22)
  );

  // TOP3
  section("佐藤優羽さんの好きなところ・魅力 TOP3", C.emerald, (y) => {
    ctx.font = font(22);
    const tops = [getValFn("top1"), getValFn("top2"), getValFn("top3")];
    for (let i = 0; i < 3; i++) {
      const t = tops[i];
      const ls = lines(t || "—", CW-48, 22);
      if (!measureOnly) {
        // 番号バッジ
        ctx.beginPath(); ctx.arc(PAD+14, y+13, 13, 0, Math.PI*2);
        ctx.fillStyle=C.emeraldPale; ctx.fill();
        ctx.strokeStyle=C.emerald; ctx.lineWidth=1.5; ctx.stroke();
        ctx.font=font(13,true); ctx.fillStyle=C.emeraldDark;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(String(i+1), PAD+14, y+13);
        // テキスト
        ctx.font=font(22); ctx.fillStyle = t ? C.ink : "#ccc";
        ctx.textAlign="left"; ctx.textBaseline="top";
        for (const l of ls) { ctx.fillText(l, PAD+34, y); y += 34; }
      } else {
        y += ls.length * 34;
      }
      y += 8;
    }
    return y;
  });

  // エピソード
  section("佐藤優羽さんの印象に残っているエピソード", C.emerald, (y) =>
    textBlock(y, getValFn("episode"), 22)
  );

  // おすすめコンテンツ
  section("佐藤優羽さんのおすすめコンテンツ", C.emerald, (y) =>
    textBlock(y, getValFn("recommend"), 22)
  );

  // 愛を叫ぼう（ピンク accent）
  section("佐藤優羽さんへの愛を叫ぼう！", C.pink, (y) =>
    textBlock(y, getValFn("love"), 24, C.pinkDeep)
  );

  sY += 10;

  // ── FOOTER ────────────────────────────────────────────
  const FTR_H = 58;
  if (!measureOnly) {
    ctx.fillStyle = C.emeraldPale; ctx.fillRect(0, sY, w, FTR_H);
    ctx.font = font(15); ctx.fillStyle = C.light;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("さとうゆほーむ  ♡  satoyu.info", w/2, sY+FTR_H/2);
  }
  sY += FTR_H;

  return sY; // 合計高さ
}

// ── 描画 ────────────────────────────────────────────────
function render() {
  const tpl = TEMPLATES[tplIdx];
  canvas.width = tpl.w;

  if (tpl.customRender) {
    // 高さ計測パス（measureOnly=true）
    canvas.height = 9999;
    const totalH = drawProfileCard(ctx, tpl.w, id => getVal(tpl, id), iconImg, true);
    // 本描画パス
    canvas.height = totalH;
    drawProfileCard(ctx, tpl.w, id => getVal(tpl, id), iconImg, false);
    document.getElementById("canvas-size-note").textContent =
      `出力サイズ: ${tpl.w} × ${totalH} px`;
  }
}

function loadBg() { render(); }

// ════════════════════════════════════════════════════════
//  UI 生成
// ════════════════════════════════════════════════════════

// ── テンプレートタブ ──────────────────────────────────
function buildTabs() {
  const container = document.getElementById("tpl-tabs");
  container.innerHTML = "";
  TEMPLATES.forEach((tpl, i) => {
    const btn = document.createElement("button");
    btn.className = "tpl-tab" + (i === tplIdx ? " active" : "");
    btn.textContent = tpl.name;
    btn.onclick = () => switchTemplate(i);
    container.appendChild(btn);
  });
}

// ── フィールドリスト ──────────────────────────────────
function buildFields() {
  const tpl = TEMPLATES[tplIdx];
  const container = document.getElementById("fields-list");
  container.innerHTML = "";

  tpl.fields.forEach((f, idx) => {
    const block = document.createElement("div");
    block.className = "field-block";

    const label = document.createElement("label");
    label.className = "field-label";
    label.textContent = f.label;
    label.htmlFor = `fi-${tpl.id}-${f.id}`;

    const el = f.multiline ? document.createElement("textarea") : document.createElement("input");
    el.id = `fi-${tpl.id}-${f.id}`;
    el.className = f.multiline ? "field-ta" : "field-input";
    el.placeholder = f.placeholder || "";
    el.value = getVal(tpl, f.id);
    if (!f.multiline) el.type = "text";
    el.addEventListener("input", e => {
      setVal(tpl, f.id, e.target.value);
      render();
    });

    block.appendChild(label);
    block.appendChild(el);

    if (idx < tpl.fields.length - 1) {
      const hr = document.createElement("hr");
      hr.className = "field-divider";
      block.appendChild(hr);
    }

    container.appendChild(block);
  });
}

// ── テンプレート切り替え ──────────────────────────────
function switchTemplate(idx) {
  tplIdx = idx;
  document.querySelectorAll(".tpl-tab").forEach((b, i) => b.classList.toggle("active", i === idx));
  buildFields();
  loadBg();
}

// ── アイコン画像アップロード ──────────────────────────
function initIconUpload() {
  const fileInput = document.getElementById("icon-file");
  const preview   = document.getElementById("icon-preview");
  const thumbWrap = document.getElementById("icon-thumb-wrap");
  const clearBtn  = document.getElementById("icon-clear-btn");

  fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        iconImg = img;
        preview.src = e.target.result;
        thumbWrap.classList.add("has-icon");
        clearBtn.style.display = "inline-block";
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    this.value = "";  // 同じファイルを再選択できるようにリセット
  });

  clearBtn.addEventListener("click", function () {
    iconImg = null;
    preview.src = "";
    thumbWrap.classList.remove("has-icon");
    clearBtn.style.display = "none";
    render();
  });
}

// ── ダウンロード ──────────────────────────────────────
function download() {
  const tpl  = TEMPLATES[tplIdx];
  const name = (getVal(tpl, "fan-name") || "card").replace(/[\s　]/g, "_");
  const a    = document.createElement("a");
  a.download = `satoyu_profile_${name}.jpg`;
  a.href     = canvas.toDataURL("image/jpeg", 0.92);
  a.click();
}

// ════════════════════════════════════════════════════════
//  初期化
// ════════════════════════════════════════════════════════
document.fonts.ready.then(() => {
  buildTabs();
  switchTemplate(0);
  document.getElementById("download-btn").addEventListener("click", download);
  initIconUpload();
});

// ── ハンバーガーメニュー ──────────────────────────────
(function () {
  const btn   = document.getElementById("hamburger");
  const links = document.getElementById("nav-links");
  if (!btn || !links) return;
  btn.addEventListener("click", function () {
    const open = links.classList.toggle("open");
    btn.textContent = open ? "✕" : "☰";
    btn.setAttribute("aria-label", open ? "メニューを閉じる" : "メニューを開く");
  });
  links.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", function () {
      links.classList.remove("open");
      btn.textContent = "☰";
      btn.setAttribute("aria-label", "メニューを開く");
    });
  });
})();
</script>
