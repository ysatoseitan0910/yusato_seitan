name: Full Deploy (scrape + build)

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @notionhq/client@2.2.15 @anthropic-ai/sdk@0.39.0

      - name: Add new blog posts
        run: node add_blog_posts.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:      ${{ secrets.DB_BLOG }}

      - name: Fill member blog meta (Name/Date/Member from URL)
        run: node update_member_blog_meta.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN:    ${{ secrets.NOTION_TOKEN }}
          DB_MEMBER_BLOG:  ${{ secrets.DB_MEMBER_BLOG }}

      - name: Update blog thumbnails
        run: node update_blog_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN:    ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:         ${{ secrets.DB_BLOG }}
          DB_MEMBER_BLOG:  ${{ secrets.DB_MEMBER_BLOG }}

      - name: Update YouTube/Lemino thumbnails & TikTok captions
        run: node update_media_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_YOUTUBE:   ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}
          DB_YU_NEWS:   ${{ secrets.DB_YU_NEWS }}
          DB_TIKTOK:    ${{ secrets.DB_TIKTOK }}

      - name: Build all pages
        run: node build.js
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          DB_COMMITTEE_NEWS:   ${{ secrets.DB_COMMITTEE_NEWS }}
          DB_YU_NEWS:          ${{ secrets.DB_YU_NEWS }}
          DB_ACTIVITIES:       ${{ secrets.DB_ACTIVITIES }}
          DB_BLOG:             ${{ secrets.DB_BLOG }}
          DB_MEMBER_BLOG:      ${{ secrets.DB_MEMBER_BLOG }}
          DB_INTERVIEW:        ${{ secrets.DB_INTERVIEW }}
          DB_TIKTOK:           ${{ secrets.DB_TIKTOK }}
          DB_INSTAGRAM:        ${{ secrets.DB_INSTAGRAM }}
          DB_X:                ${{ secrets.DB_X }}
          DB_YOUTUBE:          ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:           ${{ secrets.DB_LEMINO }}
          DB_WEB:              ${{ secrets.DB_WEB }}
          DB_SCHEDULE:         ${{ secrets.DB_SCHEDULE }}
          DB_QUIZ:             ${{ secrets.DB_QUIZ }}
          DB_HISTORY:          ${{ secrets.DB_HISTORY }}
          DB_TOP_NEWS:         ${{ secrets.DB_TOP_NEWS }}

      - name: Update thumbnails for newly synced YU_NEWS entries
        run: node update_media_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_YOUTUBE:   ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}
          DB_YU_NEWS:   ${{ secrets.DB_YU_NEWS }}
          DB_TIKTOK:    ${{ secrets.DB_TIKTOK }}

      # ★安全装置★ rsync は --delete 付きなので、ビルドが失敗して成果物が無い状態で
      # 実行すると本番サイトのHTMLを全削除してしまう（実際に403障害が発生した）。
      # 転送前に必須ページの存在とサイズを検証し、少しでも欠けていたらデプロイを中止する。
      - name: Verify build output (safety guard before rsync)
        run: |
          set -uo pipefail
          required="index.html top.html committee.html activities.html yunews.html blog.html member-blog.html interview.html x.html tiktok.html instagram.html youtube.html lemino.html history.html weekly.html quiz.html"
          missing=""
          count=0
          for f in $required; do
            if [ ! -f "$f" ]; then missing="$missing $f(なし)"; continue; fi
            size=$(wc -c < "$f")
            if [ "$size" -lt 2000 ]; then missing="$missing $f(${size}B)"; continue; fi
            count=$((count+1))
          done
          if [ -n "$missing" ]; then
            echo "::error::ビルド成果物が不足しています:$missing"
            echo "::error::本番サイトを破壊しないためデプロイを中止します"
            exit 1
          fi
          echo "✅ 必須HTML ${count} 件を確認しました。デプロイを続行します"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (satoyu.info)
        run: |
          rsync -avz --delete \
            --exclude='/uploads/' \
            --exclude='/ogp/' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='build.js' \
            --exclude='add_blog_posts.js' \
            --exclude='update_blog_thumbnails.js' \
            --exclude='update_media_thumbnails.js' \
            --exclude='download_media.js' \
            --exclude='update_notion_media.js' \
            --exclude='generate_quiz.js' \
            --exclude='reset_tiktok_yunews.js' \
            --exclude='deduplicate_yu_news.js' \
            --exclude='restore_tiktok.js' \
            --exclude='fetch.js' \
            --exclude='fix_member_names.js' \
            --exclude='scrape_member_mentions.js' \
            --exclude='_template.html' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='*.md' \
            --exclude='.claude' \
            --exclude='admin-api/.env' \
            --exclude='admin-api/node_modules' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/satoyu/

      - name: Restart admin API
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd ~/newsmind && docker compose restart satoyu-admin 2>/dev/null || docker compose up -d satoyu-admin'

      # GitHub Pages への公開は廃止（2026-08-07）
      # 公開サイト satoyu.info は上の rsync で VPS(nginx) から配信しており、Pages は独自ドメイン無しの
      # 重複ミラーだった。gh-pages への push が GitHub 側の "pages build and deployment" を毎回誘発し、
      # それがタイムアウトして全デプロイが失敗表示になっていた（1回あたり約10分の無駄）。
      # 復活させたい場合はこのコメントを peaceiris/actions-gh-pages@v3 のステップに戻す。
