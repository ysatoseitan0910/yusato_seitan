<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シリアル連続読み取り</title>
<!-- 委員会の内部ツール。サイト内からはリンクせず、検索エンジンにも載せない
     （robots.txt に書くとパスが公開されるので、ここで noindex を指定する） -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
/* 左: カメラと読み取り枠 / 右: 保存済み番号の一覧。読み取り状態は色帯で常時表示 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#1b2430; --muted:#5d6b7a; --line:#d6dde4;
  --accent:#2f6fb0; --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --okbg:#e3f4ea; --warnbg:#fbf1dd; --badbg:#f9e3e0;
  --sans:"IBM Plex Sans JP",system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171d; --panel:#1b222b; --fg:#e6ebf0; --muted:#97a5b4; --line:#2e3946;
  --accent:#6aa6e6; --ok:#4cc27e; --warn:#e2a84a; --bad:#ef7565; --okbg:#173326; --warnbg:#3a2d15; --badbg:#3d1d19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans)}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto;min-height:100%}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h1{font-size:17px;margin:0 0 10px;font-weight:600}
h2{font-size:14px;margin:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.stage{position:relative;margin-top:10px;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.stage video{width:100%;height:100%;object-fit:contain;display:block}
.guide{position:absolute;border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:border-color .15s}
.guide.ok{border-color:#4cc27e}.guide.warn{border-color:#e2a84a}.guide.dup{border-color:#6aa6e6}
.guide .hint{position:absolute;left:0;top:-26px;color:#fff;font-size:12px;white-space:nowrap;text-shadow:0 1px 2px #000}
.boxes{position:absolute;inset:0;pointer-events:none}
.status{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:52px}
.status .read{font:700 22px/1 var(--mono);letter-spacing:.12em;word-break:break-all}
.status .msg{color:var(--muted)}
.status.ok{background:var(--okbg);border-color:var(--ok)}.status.ok .msg{color:var(--ok)}
.status.warn{background:var(--warnbg);border-color:var(--warn)}.status.warn .msg{color:var(--warn)}
.status.dup{border-color:var(--accent)}.status.dup .msg{color:var(--accent)}
.status.bad .msg{color:var(--bad)}
.settings{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px;color:var(--muted);font-size:13px}
.settings label{display:flex;flex-direction:column;gap:2px}
.confirm{margin-top:12px;border:2px solid var(--warn);background:var(--warnbg);border-radius:10px;padding:12px}
.confirm canvas{max-width:100%;background:#fff;border-radius:4px;display:block;margin:8px 0}
.confirm input{font:700 22px var(--mono);letter-spacing:.12em;width:100%;text-transform:uppercase}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;font:700 18px var(--mono)}
.strip span{min-width:1.3em;text-align:center;border-bottom:3px solid var(--ok);padding:0 2px}
.strip span.unsure{color:var(--warn);border-bottom-color:var(--warn);background:var(--panel)}
.confirm .note{font-size:12.5px;color:var(--muted)}
.count{font:700 28px var(--mono)}
.list{list-style:none;margin:10px 0 0;padding:0;max-height:calc(100vh - 260px);min-height:200px;overflow:auto;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.list li.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--okbg)}to{background:transparent}}
.list .n{color:var(--muted);font:12px var(--mono);text-align:right}
.list .s{font:600 15px var(--mono);letter-spacing:.06em;word-break:break-all}
.list .t{color:var(--muted);font-size:11px}
.list img{display:block;max-width:100%;height:22px;margin-top:2px;border-radius:2px;opacity:.85}
.list .del{border:none;color:var(--muted);padding:2px 6px}
.list .del:hover{color:var(--bad)}
.empty{color:var(--muted);padding:24px 4px}
.small{font-size:12px;color:var(--muted)}
.learn{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
.learn b{font-family:var(--mono);color:var(--fg)}
.inline-confirm{display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){.list li.new{animation:none}.guide{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <h1>シリアル連続読み取り</h1>
      <div class="row">
        <select id="camSel" aria-label="カメラ"></select>
        <button id="startBtn" class="primary">カメラ開始</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <video id="video" playsinline="" muted=""></video>
      <canvas class="boxes" id="overlay"></canvas>
      <div class="guide" id="guide"><span class="hint">シリアル番号をこの枠に収めてください</span></div>
    </div>
    <div class="status" id="status"><div class="read" id="readTxt">—</div><div class="msg" id="msgTxt">「カメラ開始」を押してください</div></div>

    <div class="confirm" id="confirmBox" hidden="">
      <h2>番号を確認してください</h2>
      <canvas id="confirmCanvas"></canvas>
      <div class="strip" id="confirmStrip" aria-hidden="true"></div>
      <input type="text" id="confirmInput" autocomplete="off" spellcheck="false" aria-label="シリアル番号">
      <div class="row" style="margin-top:8px;justify-content:space-between">
        <span class="note" id="confirmNote">正しい番号に直して Enter で保存。保存と同時に文字の形を学習します。</span>
        <div class="row"><button id="skipBtn">スキップ (Esc)</button><button id="okBtn" class="primary">保存 (Enter)</button></div>
      </div>
    </div>

    <div class="settings">
      <label>桁数<input type="number" id="lenIn" min="4" max="30" value="14"></label>
      <label>枠の幅 <span id="gwV"></span><input type="range" id="gwIn" min="20" max="95" value="60"></label>
      <label>枠の高さ <span id="ghV"></span><input type="range" id="ghIn" min="5" max="50" value="14"></label>
      <label>読み取りの慎重さ<select id="strictIn"><option value="0">標準</option><option value="1">慎重（誤読をさらに減らす）</option></select></label>
    </div>
    <div class="learn" id="learnInfo"></div>
    <div class="row" style="margin-top:6px"><button id="exportHtml">学習データを埋め込んだHTMLを保存</button><button id="resetLearn">学習データをリセット</button><span class="small" id="resetMsg"></span></div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <h2>保存済み</h2><span class="count" id="count">0</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="copyBtn" class="primary">すべてコピー</button>
      <button id="dlBtn">テキスト保存 (.txt)</button>
      <button id="clearBtn">全消去</button>
      <span class="small" id="listMsg"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="manualIn" placeholder="手入力で追加" style="flex:1;min-width:0;font-family:var(--mono);text-transform:uppercase" autocomplete="off">
      <button id="manualBtn">追加</button>
    </div>
    <ul class="list" id="list"></ul>
  </section>
</div>

<script>
/* ===== 文字の切り出し・照合ロジック（DOM非依存） ===== */
const VW = 16, VH = 24;

function segment(gray, W, H) {
  // 積分画像で局所平均しきい値 → 暗い画素 = 文字
  const S = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) {
      row += gray[y * W + x];
      S[(y + 1) * (W + 1) + x + 1] = S[y * (W + 1) + x + 1] + row;
    }
  }
  const r = Math.max(6, Math.round(H / 4));
  const bin = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
      const sum = S[y1 * (W + 1) + x1] - S[y0 * (W + 1) + x1] - S[y1 * (W + 1) + x0] + S[y0 * (W + 1) + x0];
      const mean = sum / ((x1 - x0) * (y1 - y0));
      if (gray[y * W + x] < mean - 14 && gray[y * W + x] < mean * 0.85) bin[y * W + x] = 1;
    }
  }
  // 連結成分ラベリング（8近傍）
  const lab = new Int32Array(W * H);
  const comps = [];
  const stack = new Int32Array(W * H);
  let id = 0;
  for (let i = 0; i < W * H; i++) {
    if (!bin[i] || lab[i]) continue;
    id++;
    let sp = 0; stack[sp++] = i; lab[i] = id;
    let minx = W, miny = H, maxx = 0, maxy = 0, area = 0;
    while (sp) {
      const p = stack[--sp];
      const px = p % W, py = (p / W) | 0;
      area++;
      if (px < minx) minx = px; if (px > maxx) maxx = px;
      if (py < miny) miny = py; if (py > maxy) maxy = py;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = py + dy; if (ny < 0 || ny >= H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = px + dx; if (nx < 0 || nx >= W) continue;
          const q = ny * W + nx;
          if (bin[q] && !lab[q]) { lab[q] = id; stack[sp++] = q; }
        }
      }
    }
    comps.push({ x: minx, y: miny, w: maxx - minx + 1, h: maxy - miny + 1, area });
  }
  // 文字らしい大きさのものだけ残す
  let c = comps.filter(b => b.h >= H * 0.18 && b.h <= H * 0.95 && b.w <= b.h * 1.4 && b.area >= 12
    && b.y > 0 && b.y + b.h < H);
  if (!c.length) return [];
  const med = arr => { const s = [...arr].sort((a, b) => a - b); return s[s.length >> 1]; };
  const mh = med(c.map(b => b.h));
  const mcy = med(c.map(b => b.y + b.h / 2));
  c = c.filter(b => Math.abs(b.h - mh) < mh * 0.28 && Math.abs(b.y + b.h / 2 - mcy) < mh * 0.35);
  c.sort((a, b) => a.x - b.x);
  // 横方向に重なる断片は結合
  const out = [];
  for (const b of c) {
    const p = out[out.length - 1];
    if (p) {
      const ov = Math.min(p.x + p.w, b.x + b.w) - Math.max(p.x, b.x);
      if (ov > Math.min(p.w, b.w) * 0.5) {
        const x0 = Math.min(p.x, b.x), y0 = Math.min(p.y, b.y);
        p.w = Math.max(p.x + p.w, b.x + b.w) - x0; p.h = Math.max(p.y + p.h, b.y + b.h) - y0;
        p.x = x0; p.y = y0; p.area += b.area; continue;
      }
    }
    out.push({ ...b });
  }
  return out;
}

function glyphVector(gray, W, H, b) {
  const x0 = Math.max(0, b.x - 1), y0 = Math.max(0, b.y - 1);
  const x1 = Math.min(W, b.x + b.w + 1), y1 = Math.min(H, b.y + b.h + 1);
  const gw = x1 - x0, gh = y1 - y0;
  const v = new Float32Array(VW * VH);
  for (let oy = 0; oy < VH; oy++) {
    const sy0 = y0 + (oy * gh) / VH, sy1 = y0 + ((oy + 1) * gh) / VH;
    for (let ox = 0; ox < VW; ox++) {
      const sx0 = x0 + (ox * gw) / VW, sx1 = x0 + ((ox + 1) * gw) / VW;
      let s = 0, n = 0;
      for (let y = Math.floor(sy0); y < Math.max(Math.floor(sy0) + 1, Math.ceil(sy1)); y++)
        for (let x = Math.floor(sx0); x < Math.max(Math.floor(sx0) + 1, Math.ceil(sx1)); x++) {
          s += 255 - gray[Math.min(H - 1, y) * W + Math.min(W - 1, x)]; n++;
        }
      v[oy * VW + ox] = s / n;
    }
  }
  let m = 0; for (const a of v) m += a; m /= v.length;
  let nrm = 0; for (let i = 0; i < v.length; i++) { v[i] -= m; nrm += v[i] * v[i]; }
  nrm = Math.sqrt(nrm) || 1;
  for (let i = 0; i < v.length; i++) v[i] /= nrm;
  return { v: Array.from(v, a => Math.round(a * 1000) / 1000), ar: b.w / b.h };
}

function score(g, t) {
  let s = 0; for (let i = 0; i < g.v.length; i++) s += g.v[i] * t.v[i];
  return s - 0.35 * Math.abs(Math.log(g.ar / t.ar));
}

// templates: { "A": [{v, ar}, ...], ... }
function classify(g, templates) {
  let best = { ch: "?", s: -9 }, second = { ch: "?", s: -9 };
  for (const ch in templates) {
    let s = -9;
    for (const t of templates[ch]) s = Math.max(s, score(g, t));
    if (s > best.s) { second = best; best = { ch, s }; }
    else if (s > second.s) second = { ch, s };
  }
  return { ch: best.ch, s: best.s, margin: best.s - second.s, alt: second.ch };
}

    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d); t += d + 0.06;
  }
}

// ---------- 一覧 ----------
function renderList(newIdx) {
  const ul = $("list"); ul.innerHTML = "";
  $("count").textContent = items.length;
  if (!items.length) { const li = document.createElement("li"); li.className = "empty"; li.style.display = "block"; li.textContent = "まだありません。読み取った番号がここに追加されます。"; ul.appendChild(li); return; }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], li = document.createElement("li");
    if (i === newIdx) li.className = "new";
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const body = document.createElement("div");
    const s = document.createElement("div"); s.className = "s"; s.textContent = it.s;
    const t = document.createElement("div"); t.className = "t"; t.textContent = new Date(it.t).toLocaleString("ja-JP") + (it.m ? " ・ " + it.m : "");
    body.append(s, t);
    if (it.img) { const im = document.createElement("img"); im.src = it.img; im.alt = "読み取り時の画像"; body.appendChild(im); }
    const del = document.createElement("button"); del.className = "del"; del.textContent = "削除"; del.title = "この番号を削除";
    del.onclick = () => { items.splice(i, 1); persistItems(); renderList(); };
    li.append(n, body, del); ul.appendChild(li);
  }
}
function persistItems() { if (!save(LS_ITEMS, items)) { items.forEach(x => delete x.img); save(LS_ITEMS, items); } }
function addItem(s, img, mode) {
  if (items.some(x => x.s === s)) return false;
  items.push({ s, t: Date.now(), img, m: mode }); persistItems(); renderList(items.length - 1); return true;
}
const listMsg = m => { $("listMsg").textContent = m; clearTimeout(listMsg.t); listMsg.t = setTimeout(() => $("listMsg").textContent = "", 2500); };
const allText = () => items.map(x => x.s).join("\n");
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(allText()); listMsg(items.length + "件コピーしました"); }
  catch { const ta = document.createElement("textarea"); ta.value = allText(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); listMsg("コピーしました"); }
};
$("dlBtn").onclick = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([allText() + "\n"], { type: "text/plain" }));
  a.download = `serials_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
let clearArmed = null;
$("clearBtn").onclick = () => {
  if (!clearArmed) { $("clearBtn").textContent = "もう一度押すと全消去"; clearArmed = setTimeout(() => { clearArmed = null; $("clearBtn").textContent = "全消去"; }, 3000); return; }
  clearTimeout(clearArmed); clearArmed = null; $("clearBtn").textContent = "全消去";
  items = []; persistItems(); renderList(); listMsg("消去しました");
};
const clean = s => (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
function manualAdd() {
  const s = clean($("manualIn").value); if (!s) return;
  if (addItem(s, null, "手入力")) { $("manualIn").value = ""; listMsg("追加しました"); } else listMsg("すでに登録済みです");
}
$("manualBtn").onclick = manualAdd;
$("manualIn").addEventListener("keydown", e => { if (e.key === "Enter") manualAdd(); });
renderList();

// ---------- 学習データ ----------
function renderLearn() {
  const chars = Object.keys(tpl).sort();
  $("learnInfo").innerHTML = chars.length
    ? `学習済みの文字（${chars.length}種）: <b>${chars.join(" ")}</b>`
    : "";
  const missing = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("").filter(c => !tpl[c]);
  if (missing.length) $("learnInfo").innerHTML += `<br>未学習: <b>${missing.join(" ")}</b>（これらを含む券は確認画面が出ます。確認すると覚えます）`;
}
let resetArmed = null;
$("exportHtml").onclick = () => {
  const compact = {};
  for (const ch of Object.keys(tpl).sort()) compact[ch] = tpl[ch].map(t => ({ v: t.v.map(a => Math.round(a * 100) / 100), ar: Math.round(t.ar * 1000) / 1000 }));
  const open = '<script type="application/json" id="defaultTpl">';
  const i = PRISTINE.indexOf(open), j = PRISTINE.indexOf("</" + "script>", i);
  if (i < 0 || j < 0) { $("resetMsg").textContent = "書き出しに失敗しました"; return; }
  const html = PRISTINE.slice(0, i + open.length) + JSON.stringify(compact) + PRISTINE.slice(j);
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = `serial_scanner_学習済み_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.html`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $("resetMsg").textContent = `${Object.keys(compact).length}種類の文字を埋め込んだHTMLを保存しました`;
};
$("resetLearn").onclick = () => {
  if (!resetArmed) { $("resetMsg").textContent = "もう一度押すとリセットします"; resetArmed = setTimeout(() => { resetArmed = null; $("resetMsg").textContent = ""; }, 3000); return; }
  clearTimeout(resetArmed); resetArmed = null; tpl = withDefaults({}); save(LS_TPL, tpl); renderLearn(); $("resetMsg").textContent = "リセットしました";
};
// 未学習の文字を推測するための合成テンプレート（自動保存には使わない）
const synth = {};
(function buildSynth() {
  const fonts = ['"OCR B"', '"OCR-B"', "Consolas", "Verdana", "Arial", "DejaVu Sans Mono", "sans-serif"];
  const c = document.createElement("canvas"); c.width = 140; c.height = 170;
  const x = c.getContext("2d", { willReadFrequently: true });
  for (const ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789") {
    synth[ch] = [];
    for (const f of fonts) {
      x.fillStyle = "#fff"; x.fillRect(0, 0, 140, 170); x.fillStyle = "#000";
      x.font = `500 110px ${f}`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, 70, 88);
      const d = x.getImageData(0, 0, 140, 170).data, g = new Uint8Array(140 * 170);
      for (let i = 0; i < g.length; i++) g[i] = d[i * 4];
      const bs = segment(g, 140, 170); if (!bs.length) continue;
      const b = bs.reduce((a, q) => ({ x: Math.min(a.x, q.x), y: Math.min(a.y, q.y), w: Math.max(a.x + a.w, q.x + q.w) - Math.min(a.x, q.x), h: Math.max(a.y + a.h, q.y + q.h) - Math.min(a.y, q.y) }));
      synth[ch].push(glyphVector(g, 140, 170, b));
    }
  }
})();
function learn(ch, g) {
  const arr = tpl[ch] = tpl[ch] || [];
  arr.push(g); if (arr.length > MAX_TPL) arr.shift();
}
renderLearn();

// ---------- カメラ ----------
async function listCams() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("camSel"); sel.innerHTML = "";
  devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || "カメラ " + (i + 1); sel.appendChild(o); });
  const cur = stream && stream.getVideoTracks()[0]?.getSettings().deviceId;
  if (cur) sel.value = cur;
}
async function startCam(deviceId) {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (stream) stream.getTracks().forEach(t => t.stop());
  const opts = id => ({ video: { deviceId: id ? { exact: id } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  try {
    try { stream = await navigator.mediaDevices.getUserMedia(opts(deviceId)); }
    catch (e) { if (!deviceId || e.name === "NotAllowedError") throw e; stream = await navigator.mediaDevices.getUserMedia(opts(null)); }
  } catch (e) {
    setStatus("bad", "", "カメラを使えませんでした（" + (e.name || e) + "）。ブラウザのカメラ許可を確認してください。"); return;
  }
  video.srcObject = stream; await video.play();
  stage.style.aspectRatio = video.videoWidth + " / " + video.videoHeight;
  settings.cam = stream.getVideoTracks()[0]?.getSettings().deviceId || ""; save(LS_SET, settings);
  await listCams();
  $("startBtn").textContent = "カメラ再起動";
  setStatus("", "", "券を置いて、シリアル番号を枠に合わせてください");
  clearInterval(timer); timer = setInterval(tick, 180);
}
$("startBtn").onclick = () => startCam($("camSel").value || settings.cam);
$("camSel").onchange = () => startCam($("camSel").value);
if (!navigator.mediaDevices?.getUserMedia) setStatus("bad", "", "このブラウザではカメラを使えません。Chrome か Edge で開いてください。");

// ---------- 読み取りループ ----------
let prevStr = "", stable = 0, uncertain = 0, waitClear = false, lastHandled = "", offCount = 0;
let lastFrame = null;

function grab() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return null;
  const cw = vw * settings.gw / 100, ch = vh * settings.gh / 100;
  const cx = (vw - cw) / 2, cy = (vh - ch) / 2;
  let H = Math.min(220, Math.round(ch)), W = Math.round(cw * H / ch);
  if (W > 1400) { W = 1400; H = Math.round(ch * W / cw); }
  work.width = W; work.height = H;
  wctx.drawImage(video, cx, cy, cw, ch, 0, 0, W, H);
  const d = wctx.getImageData(0, 0, W, H).data, gray = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) gray[i] = (d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8;
  return { gray, W, H };
}
function drawBoxes(f, boxes, res) {
  const r = stage.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
  const c = overlay.getContext("2d"); c.clearRect(0, 0, r.width, r.height);
  if (!f) return;
  const gx = r.width * (100 - settings.gw) / 200, gy = r.height * (100 - settings.gh) / 200;
  const sx = r.width * settings.gw / 100 / f.W, sy = r.height * settings.gh / 100 / f.H;
  boxes.forEach((b, i) => {
    const ok = res && res[i] && res[i].good;
    c.strokeStyle = ok ? "#4cc27e" : "#e2a84a"; c.lineWidth = 1.5;
    c.strokeRect(gx + b.x * sx, gy + b.y * sy, b.w * sx, b.h * sy);
  });
}
function thumb(f) {
  const c = document.createElement("canvas"), h = 40, w = Math.round(f.W * h / f.H);
  c.width = w; c.height = h; c.getContext("2d").drawImage(work, 0, 0, f.W, f.H, 0, 0, w, h);
  try { return c.toDataURL("image/jpeg", 0.6); } catch { return null; }
}

function tick() {
  if (busy || !$("confirmBox").hidden || video.readyState < 2) return;
  busy = true;
  try {
    const f = grab(); if (!f) return;
    const boxes = segment(f.gray, f.W, f.H);
    const n = settings.len;
    if (boxes.length !== n) {
      drawBoxes(f, boxes, null);
      stable = 0; uncertain = 0; prevStr = "";
      if (++offCount >= 2) waitClear = false;
      if (!waitClear) setStatus("", "", boxes.length ? `番号を枠に合わせてください（${boxes.length}/${n} 文字を検出）` : "券を置いて、シリアル番号を枠に合わせてください");
      return;
    }
    offCount = 0;
    const th = thresholds();
    const glyphs = boxes.map(b => glyphVector(f.gray, f.W, f.H, b));
    const res = glyphs.map(g => { const c = classify(g, tpl); c.good = c.s >= th.minS && c.margin >= th.minM; return c; });
    drawBoxes(f, boxes, res);
    const str = res.map(r => r.ch).join("");
    const confident = res.every(r => r.good);

    if (waitClear) {
      if (!(confident && str !== lastHandled)) return; // 同じ券が置かれたまま
      waitClear = false;
    }
    if (confident) {
      uncertain = 0;
      stable = str === prevStr ? stable + 1 : 1; prevStr = str;
      setStatus("", str, `読み取り中…（${stable}/${th.frames}）`);
      if (stable >= th.frames) {
        handleConfident(str, f, glyphs, res);
      }
    } else {
      stable = 0; prevStr = "";
      uncertain++;
      const guess = res.map(r => (r.s >= 0.6 ? r.ch : "?")).join("");
      setStatus("warn", guess.replace(/\?/g, "・"), "判別できない文字があります。そのまま動かさずにお待ちください…");
      if (uncertain >= 6) openConfirm(f, boxes, glyphs, res);
    }
  } finally { busy = false; }
}

function handleConfident(str, f, glyphs, res) {
  lastHandled = str; waitClear = true; stable = 0; prevStr = "";
  if (addItem(str, thumb(f), "自動")) {
    // 確信度の高い文字は形を追加学習（照合精度の底上げ）
    glyphs.forEach((g, i) => { if (res[i].s >= 0.88 && res[i].margin >= 0.12 && (tpl[res[i].ch] || []).length < MAX_TPL) learn(res[i].ch, g); });
    save(LS_TPL, tpl);
    setStatus("ok", str, `保存しました（${items.length}件目）。次の券に交換してください`); beep("ok");
  } else {
    setStatus("dup", str, "この番号は登録済みです。次の券に交換してください"); beep("dup");
  }
}

// ---------- 確認ダイアログ（学習） ----------
let pending = null, userEdited = false, tessWorker = null, tessFailed = false;
async function tess() {
  if (tessWorker || tessFailed) return tessWorker;
  if (!window.Tesseract) { tessFailed = true; return null; }
  try {
    tessWorker = await Tesseract.createWorker("eng");
    await tessWorker.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", tessedit_pageseg_mode: "7" });
  } catch { tessFailed = true; tessWorker = null; }
  return tessWorker;
}
function openConfirm(f, boxes, glyphs, res) {
  uncertain = 0;
  const cc = $("confirmCanvas"); cc.width = f.W; cc.height = f.H;
  cc.getContext("2d").drawImage(work, 0, 0);
  pending = { glyphs, img: thumb(f) };
  const th = thresholds(); const sure = res.map(r => r.s >= th.minS && r.margin >= th.minM);
  const guessArr = res.map((r, i) => sure[i] ? r.ch : classify(glyphs[i], synth).ch);
  const guess = guessArr.join("");
  const inp = $("confirmInput"); inp.value = guess; userEdited = false;
  const strip = $("confirmStrip"); strip.innerHTML = "";
  guessArr.forEach((c, i) => { const sp = document.createElement("span"); sp.textContent = c; if (!sure[i]) sp.className = "unsure"; strip.appendChild(sp); });
  const nUnsure = sure.filter(v => !v).length;
  $("confirmNote").textContent = nUnsure
    ? `まだ覚えていない文字が ${nUnsure} 個あります（オレンジ色の推測は外れることがあります）。画像と見比べて違う文字だけ直し、Enter で保存してください。保存と同時に文字の形を覚えるので、次からは自動になります。`
    : "画像と見比べて、正しければ Enter で保存してください。";
  $("confirmBox").hidden = false; setStatus("warn", guess, "確認待ち：下の欄で番号を確認してください");
  beep("warn"); inp.focus();
  const q = sure.indexOf(false); if (q >= 0) inp.setSelectionRange(q, q + 1);
  if (nUnsure) {
    const snap = document.createElement("canvas"); snap.width = f.W; snap.height = f.H; snap.getContext("2d").drawImage(work, 0, 0);
    tess().then(w => w && w.recognize(snap)).then(r => {
      if (!r || userEdited || $("confirmBox").hidden) return;
      const t = clean(r.data.text);
      if (t.length === guess.length) {
        const merged = guessArr.map((c, i) => (sure[i] ? c : t[i]));
        inp.value = merged.join("");
        [...strip.children].forEach((sp, i) => sp.textContent = merged[i]);
      }
    }).catch(() => {});
  }
}
function closeConfirm() { $("confirmBox").hidden = true; pending = null; waitClear = true; offCount = 0; }
function confirmSave() {
  if (!pending) return;
  const s = clean($("confirmInput").value);
  if (!s || s.length !== pending.glyphs.length) { $("confirmNote").textContent = `${pending.glyphs.length}文字で入力してください（今は${s.length}文字）。`; return; }
  if (s.length === pending.glyphs.length) { pending.glyphs.forEach((g, i) => learn(s[i], g)); save(LS_TPL, tpl); renderLearn(); }
  const added = addItem(s, pending.img, "確認");
  lastHandled = s;
  closeConfirm();
  if (added) { setStatus("ok", s, `保存しました（${items.length}件目）。次の券に交換してください`); beep("ok"); }
  else { setStatus("dup", s, "この番号は登録済みです。次の券に交換してください"); beep("dup"); }
}
$("confirmInput").addEventListener("input", () => { userEdited = true; });
$("confirmInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); confirmSave(); }
  if (e.key === "Escape") { e.preventDefault(); closeConfirm(); setStatus("", "", "スキップしました。次の券をどうぞ"); }
});
$("okBtn").onclick = confirmSave;
$("skipBtn").onclick = () => { closeConfirm(); setStatus("", "", "スキップしました。次の券をどうぞ"); };
window.addEventListener("resize", () => drawBoxes(null));
})();

</script></body></html>
