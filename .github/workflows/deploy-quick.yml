name: Quick Deploy (build only)

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @notionhq/client@2.2.15

      - name: Build all pages
        run: node build.js
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          DB_COMMITTEE_NEWS:   ${{ secrets.DB_COMMITTEE_NEWS }}
          DB_YU_NEWS:          ${{ secrets.DB_YU_NEWS }}
          DB_ACTIVITIES:       ${{ secrets.DB_ACTIVITIES }}
          DB_BLOG:             ${{ secrets.DB_BLOG }}
          DB_MEMBER_BLOG:      ${{ secrets.DB_MEMBER_BLOG }}
          DB_INTERVIEW:        ${{ secrets.DB_INTERVIEW }}
          DB_TIKTOK:           ${{ secrets.DB_TIKTOK }}
          DB_X:                ${{ secrets.DB_X }}
          DB_YOUTUBE:          ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:           ${{ secrets.DB_LEMINO }}
          DB_WEB:              ${{ secrets.DB_WEB }}
          DB_SCHEDULE:         ${{ secrets.DB_SCHEDULE }}
          DB_QUIZ:             ${{ secrets.DB_QUIZ }}
          DB_HISTORY:          ${{ secrets.DB_HISTORY }}
          DB_NEWS:             ${{ secrets.DB_NEWS }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (satoyu.info)
        run: |
          rsync -avz --delete \
            --exclude='/uploads/' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='build.js' \
            --exclude='add_blog_posts.js' \
            --exclude='update_blog_thumbnails.js' \
            --exclude='update_media_thumbnails.js' \
            --exclude='download_media.js' \
            --exclude='update_notion_media.js' \
            --exclude='generate_quiz.js' \
            --exclude='reset_tiktok_yunews.js' \
            --exclude='deduplicate_yu_news.js' \
            --exclude='restore_tiktok.js' \
            --exclude='fetch.js' \
            --exclude='fix_member_names.js' \
            --exclude='scrape_member_mentions.js' \
            --exclude='_template.html' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='*.md' \
            --exclude='.claude' \
            --exclude='admin-api/.env' \
            --exclude='admin-api/node_modules' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/satoyu/

      - name: Restart admin API
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd ~/newsmind && docker compose restart satoyu-admin 2>/dev/null || docker compose up -d satoyu-admin'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,node_modules,admin-api,build.js,add_blog_posts.js,update_blog_thumbnails.js,update_media_thumbnails.js,download_media.js,update_notion_media.js,generate_quiz.js,reset_tiktok_yunews.js,deduplicate_yu_news.js,restore_tiktok.js,fetch.js,fix_member_names.js,scrape_member_mentions.js,_template.html,package.json,package-lock.json'
