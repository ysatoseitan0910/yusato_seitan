# Discord の各スレッドへ過去分をまとめて送る（手動実行のみ）。
# 送った記録は VPS（/root/satoyu-state/）と合わせるので、通常の30分ごとの通知と重複しない。
name: Discord backfill

on:
  workflow_dispatch:
    inputs:
      blog_drafts:
        description: "ブログ告知の下書き：直近何件（0=送らない）"
        default: "3"
      blog_photos:
        description: "ブログ写真：直近何件（0=送らない）"
        default: "10"
      member_blog_since:
        description: "他メンバーブログ：この日以降（YYYY-MM-DD・空=送らない）"
        default: ""
      birthday_days:
        description: "お誕生日：何日先まで（0=送らない）"
        default: "0"
      flower:
        description: "祝花：募集中の企画の告知文案を送る（yes/no）"
        default: "no"
      member_media_since:
        description: "他メンバーブログのカード画像を佐藤優羽さんの写真に差し替え：この日以降（YYYY-MM-DD・空=しない）"
        default: ""
      news_since:
        description: "公式ニュース→スケジュール・ヒストリー：この日以降（YYYY-MM-DD・空=しない）"
        default: ""
      dry_run:
        description: "他メンバーブログ・公式ニュースを書き込まずに判定結果だけ表示する（yes/no）"
        default: "no"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install @notionhq/client@2.2.15 @anthropic-ai/sdk@1.7.0
      - name: Setup SSH / restore state
        run: |
          mkdir -p ~/.ssh state
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/satoyu-state/*.json" state/ || true

      - name: ブログ告知の下書き
        if: inputs.blog_drafts != '0'
        run: node discord_backfill.js blogdraft ${{ inputs.blog_drafts }}
      - name: ブログ写真
        if: inputs.blog_photos != '0'
        run: node discord_backfill.js blogphoto ${{ inputs.blog_photos }}
      - name: 他メンバーブログ
        if: inputs.member_blog_since != ''
        run: node sync_member_blog_bsky.js
        env:
          NOTIFY_ONLY: "1"
          BSKY_SINCE: ${{ inputs.member_blog_since }}
          DRY_RUN: ${{ inputs.dry_run == 'yes' && '1' || '' }}
      - name: お誕生日
        if: inputs.birthday_days != '0'
        run: node notify_birthday.js
        env:
          BIRTHDAY_WITHIN: ${{ inputs.birthday_days }}
      - name: 祝花
        if: inputs.flower == 'yes'
        run: node discord_backfill.js flower
      - name: 他メンバーブログのカード画像
        if: inputs.member_media_since != ''
        run: node sync_member_blog_bsky.js
        env:
          NOTION_TOKEN:   ${{ secrets.NOTION_TOKEN }}
          DB_MEMBER_BLOG: ${{ secrets.DB_MEMBER_BLOG }}
          SET_MEDIA: "1"
          BSKY_SINCE: ${{ inputs.member_media_since }}
          BSKY_MAX_PAGES: "200"
          DRY_RUN: ${{ inputs.dry_run == 'yes' && '1' || '' }}
      - name: 公式ニュース → スケジュール・ヒストリー
        if: inputs.news_since != ''
        run: node sync_official_news.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_SCHEDULE:  ${{ secrets.DB_SCHEDULE }}
          DB_HISTORY:   ${{ secrets.DB_HISTORY }}
          NEWS_SINCE:   ${{ inputs.news_since }}
          DRY_RUN: ${{ inputs.dry_run == 'yes' && '1' || '' }}

      - name: Save state
        if: always()
        run: |
          ls state/*.json >/dev/null 2>&1 || exit 0
          VPS=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          mkdir -p state_remote
          scp -i ~/.ssh/id_rsa "$VPS:/root/satoyu-state/*.json" state_remote/ 2>/dev/null || true
          node merge_state.js state_remote state
          ssh -i ~/.ssh/id_rsa $VPS 'mkdir -p /root/satoyu-state'
          scp -i ~/.ssh/id_rsa state/*.json "$VPS:/root/satoyu-state/"
