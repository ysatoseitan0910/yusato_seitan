name: Full Deploy (scrape + build)

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @notionhq/client@2.2.15 @anthropic-ai/sdk@0.39.0

      - name: Add new blog posts
        run: node add_blog_posts.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:      ${{ secrets.DB_BLOG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 新着ブログの告知下書き＋写真を送る（未設定なら送らない）

      # Bluesky の blogphotobot から、他メンバーのブログへの佐藤優羽さんの登場を検出（少人数は公開・中人数は下書き・集合写真は除外）
      - name: Detect member blog appearances (Bluesky blogphotobot)
        run: node sync_member_blog_bsky.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN:    ${{ secrets.NOTION_TOKEN }}
          DB_MEMBER_BLOG:  ${{ secrets.DB_MEMBER_BLOG }}

      # Lemino で配信が始まった回を登録（日向坂で会いましょう＝公開／まだまだ！＝あらすじに名前が無ければ下書き）
      - name: Detect new Lemino episodes
        run: node sync_lemino.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}

      - name: Fill member blog meta (Name/Date/Member from URL)
        run: node update_member_blog_meta.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN:    ${{ secrets.NOTION_TOKEN }}
          DB_MEMBER_BLOG:  ${{ secrets.DB_MEMBER_BLOG }}

      - name: Update blog thumbnails
        run: node update_blog_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN:    ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:         ${{ secrets.DB_BLOG }}
          DB_MEMBER_BLOG:  ${{ secrets.DB_MEMBER_BLOG }}

      - name: Update YouTube/Lemino thumbnails & TikTok captions
        run: node update_media_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_YOUTUBE:   ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}
          DB_YU_NEWS:   ${{ secrets.DB_YU_NEWS }}
          DB_TIKTOK:    ${{ secrets.DB_TIKTOK }}

      - name: Build all pages
        run: node build.js
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          DB_COMMITTEE_NEWS:   ${{ secrets.DB_COMMITTEE_NEWS }}
          DB_YU_NEWS:          ${{ secrets.DB_YU_NEWS }}
          DB_ACTIVITIES:       ${{ secrets.DB_ACTIVITIES }}
          DB_BLOG:             ${{ secrets.DB_BLOG }}
          DB_MEMBER_BLOG:      ${{ secrets.DB_MEMBER_BLOG }}
          DB_INTERVIEW:        ${{ secrets.DB_INTERVIEW }}
          DB_TIKTOK:           ${{ secrets.DB_TIKTOK }}
          DB_INSTAGRAM:        ${{ secrets.DB_INSTAGRAM }}
          DB_X:                ${{ secrets.DB_X }}
          DB_YOUTUBE:          ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:           ${{ secrets.DB_LEMINO }}
          DB_WEB:              ${{ secrets.DB_WEB }}
          DB_SCHEDULE:         ${{ secrets.DB_SCHEDULE }}
          DB_QUIZ:             ${{ secrets.DB_QUIZ }}
          DB_HISTORY:          ${{ secrets.DB_HISTORY }}
          DB_TOP_NEWS:         ${{ secrets.DB_TOP_NEWS }}

      - name: Update thumbnails for newly synced YU_NEWS entries
        run: node update_media_thumbnails.js
        continue-on-error: true   # 収集失敗でサイト更新は止めない（ビルドのみ致命的）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_YOUTUBE:   ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}
          DB_YU_NEWS:   ${{ secrets.DB_YU_NEWS }}
          DB_TIKTOK:    ${{ secrets.DB_TIKTOK }}

      # ★安全装置★ rsync は --delete 付きなので、ビルドが失敗して成果物が無い状態で
      # 実行すると本番サイトのHTMLを全削除してしまう（実際に403障害が発生した）。
      # 転送前に必須ページの存在とサイズを検証し、少しでも欠けていたらデプロイを中止する。
      - name: Verify build output (safety guard before rsync)
        run: |
          set -uo pipefail
          required="index.html top.html committee.html activities.html yunews.html blog.html member-blog.html interview.html x.html tiktok.html instagram.html youtube.html lemino.html history.html weekly.html quiz.html"
          missing=""
          count=0
          for f in $required; do
            if [ ! -f "$f" ]; then missing="$missing $f(なし)"; continue; fi
            size=$(wc -c < "$f")
            if [ "$size" -lt 2000 ]; then missing="$missing $f(${size}B)"; continue; fi
            count=$((count+1))
          done
          if [ -n "$missing" ]; then
            echo "::error::ビルド成果物が不足しています:$missing"
            echo "::error::本番サイトを破壊しないためデプロイを中止します"
            exit 1
          fi
          echo "✅ 必須HTML ${count} 件を確認しました。デプロイを続行します"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # minsaka の主催企画を見て、募集開始・締め切りリマインド・募集終了の告知下書きを Discord に送る。
      # 送った記録（minsaka-state.json）は実行環境に残らないので VPS に置き、前後で取ってきて書き戻す。
      # minsaka.json（企画一覧）は下の rsync で公開され、管理ページの下書き画面が読む。
      - name: minsaka announcement drafts (Discord)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VPS=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VPS:/root/satoyu-state/minsaka-state.json . 2>/dev/null || echo "state なし（初回は記録だけ）"
          node notify_minsaka.js
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VPS 'mkdir -p /root/satoyu-state'
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no minsaka-state.json $VPS:/root/satoyu-state/minsaka-state.json

      - name: Deploy to VPS (satoyu.info)
        run: |
          rsync -avz --delete \
            --exclude='/uploads/' \
            --exclude='/ogp/' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='build.js' \
            --exclude='add_blog_posts.js' \
            --exclude='update_blog_thumbnails.js' \
            --exclude='update_media_thumbnails.js' \
            --exclude='download_media.js' \
            --exclude='update_notion_media.js' \
            --exclude='generate_quiz.js' \
            --exclude='reset_tiktok_yunews.js' \
            --exclude='deduplicate_yu_news.js' \
            --exclude='restore_tiktok.js' \
            --exclude='fetch.js' \
            --exclude='fix_member_names.js' \
            --exclude='scrape_member_mentions.js' \
            --exclude='sync_member_blog_bsky.js' \
            --exclude='sync_lemino.js' \
            --exclude='notify_minsaka.js' \
            --exclude='discord.js' \
            --exclude='minsaka-state.json' \
            --exclude='_template.html' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='*.md' \
            --exclude='.claude' \
            --exclude='admin-api/.env' \
            --exclude='admin-api/node_modules' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/satoyu/

      - name: Restart admin API
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd ~/newsmind && docker compose restart satoyu-admin 2>/dev/null || docker compose up -d satoyu-admin'

      # weekly さとうゆを自動生成する。対象は「前の週（月〜日）」で、月曜 12:00（JST）以降に作る。
      # 日曜深夜放送の Lemino 回は月曜 01:50 に配信が始まり、上の同期で登録されてから年表に入るので、
      # 月曜の朝までは待つ。onlyIfMissing なので、作成済みの週は作り直さない（手直しを上書きしない）。
      # 管理APIのパスワードを GitHub に置かないよう、VPS のコンテナ内から呼ぶ。
      - name: Generate weekly さとうゆ (previous week)
        continue-on-error: true
        run: |
          TARGET=$(node -e '
            const now = new Date(Date.now() + 9 * 3600e3);                  // JST の壁時計
            const dow = now.getUTCDay();                                     // 0=日
            const mon = new Date(now); mon.setUTCDate(now.getUTCDate() - ((dow + 6) % 7)); mon.setUTCHours(0, 0, 0, 0);
            if (now - mon < 12 * 3600e3) process.exit(0);                    // 月曜 12:00 前は作らない
            const prev = new Date(mon); prev.setUTCDate(mon.getUTCDate() - 7);
            console.log(prev.toISOString().slice(0, 10));')
          if [ -z "$TARGET" ]; then echo "月曜12時前のためスキップ"; exit 0; fi
          sleep 5   # 直前の satoyu-admin 再起動を待つ
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ~/newsmind && docker compose exec -T satoyu-admin node -e \"fetch('http://localhost:3001/generate/weekly',{method:'POST',headers:{Authorization:'Bearer '+process.env.ADMIN_PASSWORD,'Content-Type':'application/json'},body:JSON.stringify({date:'$TARGET',onlyIfMissing:true})}).then(r=>r.json()).then(j=>console.log(j.skipped?'作成済み: '+j.title:(j.ok?'✅ 作成: '+j.title:'❌ '+JSON.stringify(j))))\""

      # GitHub Pages への公開は廃止（2026-08-07）
      # 公開サイト satoyu.info は上の rsync で VPS(nginx) から配信しており、Pages は独自ドメイン無しの
      # 重複ミラーだった。gh-pages への push が GitHub 側の "pages build and deployment" を毎回誘発し、
      # それがタイムアウトして全デプロイが失敗表示になっていた（1回あたり約10分の無駄）。
      # 復活させたい場合はこのコメントを peaceiris/actions-gh-pages@v3 のステップに戻す。
