<style>
:root {
  --emerald: #3DAA78;
  --emerald-dark: #1f7a52;
  --emerald-light: #d4ecde;
  --emerald-pale: #ecf7f0;
  --pink: #f7b6c8;
  --pink-pale: #fde7ed;
  --ink: #1a2a22;
  --text-muted: #516259;
  --text-light: #9aaca3;
  --border: #e3eee6;
  --bg: #fdfcf7;
  --white: #fff;
  --nav-h: 60px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Klee One', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-top: var(--nav-h);
}

/* ── Nav ── */
nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(253,252,247,0.95); backdrop-filter: blur(10px); border-bottom: 2px dotted var(--emerald-light); z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-mark { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 3px 0 var(--emerald-dark); transform: rotate(-4deg); flex-shrink: 0; }
.nav-logo-main { font-weight: 600; color: var(--emerald-dark); font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
.nav-links { display: flex; gap: 0; align-items: center; }
.nav-links a { text-decoration: none; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-radius: 99px; transition: all 0.15s; white-space: nowrap; }
.nav-links a:hover, .nav-links a.active { background: var(--pink-pale); color: var(--emerald-dark); }
.nav-sep { display: inline-flex; width: 1px; height: 14px; background: var(--border); margin: 0 6px; align-self: center; flex-shrink: 0; }
.nav-committee-label { display: none; }
.hamburger { display: none; background: none; border: none; cursor: pointer; font-size: 22px; color: var(--emerald-dark); padding: 4px 8px; line-height: 1; border-radius: 6px; }
.hamburger:hover { background: var(--pink-pale); }

/* ── Editor layout ── */
.editor-page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
.editor-heading { margin-bottom: 24px; }
.editor-heading h1 { font-size: 22px; font-weight: 600; color: var(--emerald-dark); }
.editor-heading p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* Template tabs */
.tpl-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tpl-tab {
  padding: 8px 20px; border: 2px solid var(--border); border-radius: 99px;
  background: var(--white); font-family: 'Klee One', serif; font-size: 14px;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.tpl-tab:hover { border-color: var(--emerald); color: var(--emerald-dark); }
.tpl-tab.active { border-color: var(--emerald); background: var(--emerald); color: #fff; box-shadow: 2px 2px 0 var(--emerald-dark); }

/* Two-column layout */
.editor-body { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }

/* Canvas area */
.canvas-wrap {
  position: sticky; top: calc(var(--nav-h) + 12px);
  background: var(--white); border: 2px solid var(--ink); border-radius: 16px;
  padding: 16px; box-shadow: 4px 4px 0 var(--emerald-dark);
}
.canvas-label { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.06em; }
#preview-canvas {
  width: 100%; height: auto; display: block;
  border-radius: 8px; border: 1px solid var(--border);
}
.canvas-size-note { font-size: 11px; color: var(--text-light); margin-top: 8px; text-align: right; }

/* Controls */
.controls {
  background: var(--white); border: 2px solid var(--ink); border-radius: 16px;
  padding: 22px; box-shadow: 4px 4px 0 var(--emerald);
  display: flex; flex-direction: column; gap: 18px;
}
.controls-title { font-size: 15px; font-weight: 600; color: var(--ink); padding-bottom: 12px; border-bottom: 2px dashed var(--border); }

/* Fields */
.field-block { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.field-input, .field-ta {
  width: 100%; padding: 9px 12px;
  border: 2px solid var(--border); border-radius: 10px;
  font-family: 'Klee One', serif; font-size: 14px;
  background: var(--bg); color: var(--ink);
  transition: border-color 0.15s;
  resize: vertical;
}
.field-input:focus, .field-ta:focus { outline: none; border-color: var(--emerald); }
.field-ta { min-height: 72px; }

/* Field options (font-size, color, font) */
.field-options { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field-opt-label { font-size: 11px; color: var(--text-light); }
.field-opt-select {
  padding: 3px 8px; border: 1.5px solid var(--border); border-radius: 6px;
  font-size: 12px; font-family: inherit; background: var(--bg);
  cursor: pointer;
}
.field-opt-color {
  width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 1px; background: none;
}

/* Divider */
.field-divider { border: none; border-top: 1px dashed var(--border); }

/* Icon upload */
.icon-section { display: flex; flex-direction: column; gap: 8px; }
.icon-section-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.icon-row { display: flex; align-items: center; gap: 14px; }
.icon-thumb-wrap { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
.icon-thumb {
  width: 68px; height: 68px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border); display: none;
}
.icon-thumb-wrap.has-icon .icon-thumb { display: block; }
.icon-thumb-wrap.has-icon .icon-thumb-empty { display: none; }
.icon-thumb-empty {
  width: 68px; height: 68px; border-radius: 50%;
  border: 2px dashed var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-light);
}
.icon-btns { display: flex; flex-direction: column; gap: 6px; }
#icon-file { display: none; }
.icon-select-btn {

  font-family: 'Klee One', serif; font-size: 13px; cursor: pointer;

.icon-clear-btn {

/* Download / Share */

.download-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--emerald-dark); }

/* Footer */

  .canvas-wrap { position: static; }
  .controls { order: -1; }
}

// ── roundRect ポリフィル（Safari 15以前対応）──────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y); this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r); this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h); this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r); this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
  };
}

// ════════════════════════════════════════════════════════
//  共有フィールド定義（全テンプレート共通）
// ════════════════════════════════════════════════════════
const SHARED_FIELDS = [
  { id: "fan-name",   label: "ファン名",                       placeholder: "さとうゆふんふん" },
  { id: "handle",     label: "X（Twitter）ID",                 placeholder: "@satoyuhome" },

  { id: "episode",    label: "印象に残っているエピソード",     placeholder: "〇〇のコンサートで…", multiline: true },
  { id: "recommend",  label: "おすすめコンテンツ",             placeholder: "〇〇のブログ / 〇〇の動画…", multiline: true },
  { id: "love",       label: "佐藤優羽さんへの愛を叫ぼう！", placeholder: "優羽ちゃん大好き！", multiline: true },
];

// ════════════════════════════════════════════════════════
//  テンプレート定義
// ════════════════════════════════════════════════════════
const TEMPLATES = [
  { id: "notebook", name: "ノート見開き",   w: 880, customRender: true, fields: SHARED_FIELDS },
  { id: "booklet",  name: "プロフィール帳", w: 660, customRender: true, fields: SHARED_FIELDS },
  { id: "sticker",  name: "ステッカー帳",   w: 660, customRender: true, fields: SHARED_FIELDS },
];

// ════════════════════════════════════════════════════════
//  状態管理
// ════════════════════════════════════════════════════════
let tplIdx = 0;
const values = {};  // { templateId__fieldId: text }
let iconImg  = null;

// ════════════════════════════════════════════════════════
//  Canvas
// ════════════════════════════════════════════════════════
const canvas = document.getElementById("preview-canvas");
const ctx    = canvas.getContext("2d");

function tplKey(tpl, id) { return `${tpl.id}__${id}`; }
function getVal(tpl, id) { return values[tplKey(tpl, id)] || ""; }
function setVal(tpl, id, v) { values[tplKey(tpl, id)] = v; }

// ── テキスト折り返し（日本語対応）──────────────────────
function wrapText(ctx, text, maxW) {
  const lines = [];
  for (const raw of (text || "").split("\n")) {
    if (!raw) { lines.push(""); continue; }
    let line = "";
    for (const ch of raw) {
      if (ctx.measureText(line + ch).width > maxW && line.length > 0) {
        lines.push(line); line = ch;
      } else { line += ch; }
    }
    if (line) lines.push(line);
  }
  return lines;
}

// ── アイコン円形描画ヘルパー ────────────────────────────
function drawIconCircle(ctx, img, cx, cy, r, borderColor, borderW) {
  if (img) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sc = Math.max((r*2)/iw, (r*2)/ih);
    const sw = (r*2)/sc, sh = (r*2)/sc;
    ctx.drawImage(img, (iw-sw)/2, (ih-sh)/2, sw, sh, cx-r, cy-r, r*2, r*2);
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#ecf7f0"; ctx.fill();
    ctx.font = `${Math.round(r*0.55)}px 'Klee One', serif`;
    ctx.fillStyle = "#3DAA78"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("ゆ", cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = borderColor || "rgba(255,255,255,0.85)";
  ctx.lineWidth = borderW || 5; ctx.stroke();
}

// ════════════════════════════════════════════════════════
//  プロフィールカード 描画エンジン
// ════════════════════════════════════════════════════════
function drawProfileCard(ctx, w, getValFn, icoImg, measureOnly) {
  const PAD  = 54;
  const CW   = w - PAD * 2;
  const C = {
    emerald:     "#3DAA78",
    emeraldDark: "#1f7a52",
    emeraldPale: "#ecf7f0",
    pink:        "#f7b6c8",
    pinkDeep:    "#e05888",
    inkDark:     "#0f1e16",
    ink:         "#1a2a22",
    muted:       "#516259",
    light:       "#9aaca3",
    border:      "#d8ece0",
    bg:          "#fdfcf7",
    white:       "#ffffff",
  };

  function font(size, bold, family) {
    return `${bold?"600 ":""}${size}px '${family||"Klee One"}', 'Noto Sans JP', sans-serif`;
  }
  function lines(text, maxW, size, bold) {
    ctx.font = font(size, bold);
    return wrapText(ctx, text, maxW);
  }

  // ── HEADER ────────────────────────────────────────────
  const HDR_H = 185;
  if (!measureOnly) {
    const g = ctx.createLinearGradient(0, 0, w, HDR_H);
    g.addColorStop(0, C.emeraldDark);
    g.addColorStop(1, C.emerald);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, HDR_H);
    // 装飾円
    ctx.beginPath(); ctx.arc(w-40, -10, 150, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.05)"; ctx.fill();
    ctx.beginPath(); ctx.arc(50, HDR_H+10, 100, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.04)"; ctx.fill();
    // タイトル
    ctx.font=font(54,true,"Caveat"); ctx.fillStyle="rgba(255,255,255,0.95)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("♡ さとうゆ ♡", w/2, 85);
    ctx.font=font(20,false); ctx.fillStyle="rgba(255,255,255,0.70)";
    ctx.fillText("fan profile card", w/2, 138);
    // ハートデコ
    ctx.font="15px sans-serif"; ctx.fillStyle="rgba(255,255,255,0.35)";
    ctx.textBaseline="middle";
    ctx.fillText("♥", PAD, 165); ctx.fillText("♥", w-PAD-14, 165);
  }

  // ── PROFILE（左アイコン ／ 右テキスト）──────────────────
  const ICON_R  = 80;
  const ICON_CX = PAD + ICON_R;           // 134
  const RIGHT_X = ICON_CX + ICON_R + 24;  // 238
  const RIGHT_W = w - RIGHT_X - PAD;      // 608

  // 右側コンテンツ高さを計測して PRF_H を動的決定
  const _nameText  = getValFn("fan-name");
  const _handle    = getValFn("handle");
  const _oy        = getValFn("oshi-years");
  ctx.font = font(36, true);
  const _nameLines = wrapText(ctx, _nameText || "ファン名", RIGHT_W);
  const _nameH  = _nameLines.length * 46;
  const _hndH   = _handle   ? 32 : 0;
  const _oyH    = _oy       ? 36 : 0;
  const _contentH = _nameH + (_hndH ? _hndH + 8 : 0) + (_oyH ? _oyH + 8 : 0);
  const PRF_H = Math.max(ICON_R * 2 + 40, _contentH + 60); // 最小 200px

  const ICON_CY = HDR_H + PRF_H / 2;

  if (!measureOnly) {
    ctx.fillStyle = C.white; ctx.fillRect(0, HDR_H, w, PRF_H);

    // ── アイコン（左）
    drawIconCircle(ctx, icoImg, ICON_CX, ICON_CY, ICON_R, C.pink, 6);

    // ── 右側コンテンツ（縦中央揃え）
    let ry = ICON_CY - _contentH / 2;

    // ファン名
    ctx.font = font(36, true); ctx.fillStyle = C.inkDark;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    for (const l of _nameLines) { ctx.fillText(l, RIGHT_X, ry); ry += 46; }

    // X ID
    if (_handle) {
      ry += 6;
      ctx.font = font(20); ctx.fillStyle = C.muted;
      ctx.fillText(_handle.startsWith("@") ? _handle : `@${_handle}`, RIGHT_X, ry);
      ry += 28;
    }

    // 推し歴 pill
    if (_oy) {
      ry += 8;
      ctx.font = font(16);
      const pt = `📅 推し歴：${_oy}`;
      const pw = ctx.measureText(pt).width + 28, ph = 28;
      ctx.beginPath(); ctx.roundRect(RIGHT_X, ry, pw, ph, 99);
      ctx.fillStyle = C.emeraldPale; ctx.fill();
      ctx.strokeStyle = C.emerald; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = C.emeraldDark;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(pt, RIGHT_X + 14, ry + ph / 2);
    }

    // 下境界線
    ctx.strokeStyle = C.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, HDR_H+PRF_H); ctx.lineTo(w, HDR_H+PRF_H); ctx.stroke();
  }

  // ── SECTIONS ──────────────────────────────────────────
  let sY = HDR_H + PRF_H + 20;

  function drawLabel(y, text, color) {
    if (measureOnly) return;
    ctx.font = font(15, true);
    const lw = Math.min(ctx.measureText(text).width + 44, CW);
    ctx.beginPath(); ctx.roundRect(PAD, y, lw, 32, 99);
    ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = C.white; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(text, PAD+22, y+16);
  }

  function drawDivider(y) {
    if (measureOnly) return;
    ctx.save(); ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(w-PAD,y);
    ctx.strokeStyle=C.border; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }

  function section(labelText, labelColor, contentFn) {
    drawLabel(sY, labelText, labelColor);
    sY += 32 + 14;
    sY = contentFn(sY);
    sY += 14;
    drawDivider(sY);
    sY += 20;
  }

  function textBlock(y, text, size, color) {
    ctx.font = font(size);
    const ls = lines(text, CW-8, size);
    if (!ls.length || !ls[0]) {
      if (!measureOnly) {
        ctx.fillStyle="#ccc"; ctx.textAlign="left"; ctx.textBaseline="top";
        ctx.fillText("—", PAD+4, y);
      }
      return y + size * 1.6;
    }
    if (!measureOnly) {
      ctx.fillStyle = color || C.ink;
      ctx.textAlign="left"; ctx.textBaseline="top";
    }
    const lh = Math.round(size * 1.55);
    for (const l of ls) {
      if (!measureOnly) ctx.fillText(l, PAD+4, y);
      y += lh;
    }
    return y;
  }

  // きっかけ
  section("佐藤優羽さんを好きになったきっかけ", C.emerald, (y) =>
    textBlock(y, getValFn("reason"), 22)
  );

  // TOP3
  section("佐藤優羽さんの好きなところ・魅力 TOP3", C.emerald, (y) => {
    ctx.font = font(22);
    const tops = [getValFn("top1"), getValFn("top2"), getValFn("top3")];
    for (let i = 0; i < 3; i++) {
      const t = tops[i];
      const ls = lines(t || "—", CW-48, 22);
      if (!measureOnly) {
        // 番号バッジ
        ctx.beginPath(); ctx.arc(PAD+14, y+13, 13, 0, Math.PI*2);
        ctx.fillStyle=C.emeraldPale; ctx.fill();
        ctx.strokeStyle=C.emerald; ctx.lineWidth=1.5; ctx.stroke();
        ctx.font=font(13,true); ctx.fillStyle=C.emeraldDark;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(String(i+1), PAD+14, y+13);
        // テキスト
        ctx.font=font(22); ctx.fillStyle = t ? C.ink : "#ccc";
        ctx.textAlign="left"; ctx.textBaseline="top";
        for (const l of ls) { ctx.fillText(l, PAD+34, y); y += 34; }
      } else {
        y += ls.length * 34;
      }
      y += 8;
    }
    return y;
  });

  // エピソード
  section("佐藤優羽さんの印象に残っているエピソード", C.emerald, (y) =>
    textBlock(y, getValFn("episode"), 22)
  );

  // おすすめコンテンツ
  section("佐藤優羽さんのおすすめコンテンツ", C.emerald, (y) =>
    textBlock(y, getValFn("recommend"), 22)
  );

  // 愛を叫ぼう（ピンク accent）
  section("佐藤優羽さんへの愛を叫ぼう！", C.pink, (y) =>
    textBlock(y, getValFn("love"), 24, C.pinkDeep)
  );

  sY += 10;

  // ── FOOTER ────────────────────────────────────────────
  const FTR_H = 58;
  if (!measureOnly) {
    ctx.fillStyle = C.emeraldPale; ctx.fillRect(0, sY, w, FTR_H);
    ctx.font = font(15); ctx.fillStyle = C.light;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("さとうゆほーむ  ♡  satoyu.info", w/2, sY+FTR_H/2);
  }
  sY += FTR_H;

  return sY; // 合計高さ
}

// ════════════════════════════════════════════════════════
//  案4 プロフィール帳 描画エンジン
// ════════════════════════════════════════════════════════
function drawBooklet(ctx, w, getV, ico, measureOnly) {
  const PAD = 18, GAP = 11;
  const CW = w - PAD * 2;
  const HALF = (CW - GAP) / 2;
  const BPH = 14, BPT = 11, BPB = 13;
  const PLH = 22, PLMB = 7;
  const FS = 15.5, LH = Math.ceil(FS * 1.6);
  const C = {
    mint:"#3DAA78", mintDark:"#1f7a52", mintPale:"#eaf6ee",
    pink:"#f7b6c8", pinkDeep:"#d8567f", pinkPale:"#fdeef3",
    ink:"#1f2e25", muted:"#5b6c63", border:"#e3eee6", white:"#ffffff",
  };
  function f(sz,bold,fam){return`${bold?"600 ":""}${sz}px '${fam||"Klee One"}','Noto Sans JP',sans-serif`;}
  function nLines(text,iw,sz,bold){ctx.font=f(sz,bold);const ls=wrapText(ctx,text||"",iw);return Math.max(1,ls.filter(l=>l!=="").length);}
  function bH(cH){return BPT+PLH+PLMB+cH+BPB;}
  function drawBoxBg(x,y,bw,bh,accent){
    ctx.beginPath();ctx.roundRect(x,y,bw,bh,14);
    ctx.fillStyle=accent?C.pinkPale:C.white;ctx.fill();
    ctx.strokeStyle=accent?C.pink:C.border;ctx.lineWidth=2;ctx.stroke();
  }
  function drawPill(x,y,label,accent){
    ctx.font=f(12,true);
    const pw=ctx.measureText(label).width+22;
    ctx.beginPath();ctx.roundRect(x,y,pw,PLH,99);
    ctx.fillStyle=accent?C.pinkPale:C.mintPale;ctx.fill();
    ctx.fillStyle=accent?C.pinkDeep:C.mintDark;
    ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(label,x+11,y+PLH/2);
  }
  function drawTextBox(text,x,y,iw,sz,color){
    ctx.font=f(sz);ctx.fillStyle=color||C.ink;
    ctx.textAlign="left";ctx.textBaseline="top";
    const ls=wrapText(ctx,text||"",iw);
    const lh=Math.ceil(sz*1.6);
    if(!ls.filter(l=>l).length){ctx.fillStyle="#ccc";ctx.fillText("—",x,y);return;}
    for(const l of ls){ctx.fillText(l,x,y);y+=lh;}
  }
  // Header
  const HDR_H=96;
  if(!measureOnly){
    const g=ctx.createLinearGradient(0,0,w*0.87,HDR_H*0.5);
    g.addColorStop(0,C.mintDark);g.addColorStop(0.7,C.mint);g.addColorStop(1,"#6fc79b");
    ctx.fillStyle=g;ctx.fillRect(0,0,w,HDR_H);
    const IR=32,IX=PAD+22+IR,IY=HDR_H/2;
    drawIconCircle(ctx,ico,IX,IY,IR,"#fff",4);
    const TX=IX+IR+16;
    ctx.font=f(34,true,"Caveat");ctx.fillStyle="#fff";ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText("♡ さとうゆ fan profile ♡",TX,HDR_H/2-12);
    ctx.font=f(13);ctx.fillStyle="rgba(255,255,255,0.85)";ctx.textBaseline="top";
    ctx.fillText("my oshi profile note",TX,HDR_H/2+5);
    ctx.font="20px sans-serif";ctx.fillStyle="rgba(255,255,255,0.4)";
    ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText("♥",w-PAD,HDR_H/2);
  }
  let sY=HDR_H+PAD;
  const LX=PAD,RX=PAD+HALF+GAP;
  // Row1: fan-name (span 2)
  {
    const iw=CW-BPH*2,lh21=Math.ceil(21*1.6);
    const n=nLines(getV("fan-name"),iw,21,true);
    const bh=bH(n*lh21);
    if(!measureOnly){
      drawBoxBg(LX,sY,CW,bh,false);drawPill(LX+BPH,sY+BPT,"ファン名",false);
      ctx.font=f(21,true);ctx.fillStyle=C.ink;ctx.textAlign="left";ctx.textBaseline="top";
      const ls=wrapText(ctx,getV("fan-name")||"",iw);let ty=sY+BPT+PLH+PLMB;
      for(const l of ls){if(l)ctx.fillText(l,LX+BPH,ty);ty+=lh21;}
    }
    sY+=bh+GAP;
  }
  // Row2: handle | oshi-years
  {
    const iw=HALF-BPH*2;
    const rH=Math.max(bH(nLines(getV("handle"),iw,FS,false)*LH),bH(nLines(getV("oshi-years"),iw,FS,false)*LH));
    if(!measureOnly){
      drawBoxBg(LX,sY,HALF,rH,false);drawPill(LX+BPH,sY+BPT,"X ID",false);
      drawTextBox(getV("handle"),LX+BPH,sY+BPT+PLH+PLMB,iw,FS);
      drawBoxBg(RX,sY,HALF,rH,false);drawPill(RX+BPH,sY+BPT,"推し歴",false);
      drawTextBox(getV("oshi-years"),RX+BPH,sY+BPT+PLH+PLMB,iw,FS);
    }
    sY+=rH+GAP;
  }
  // Row3: TOP3 (span 2)
  {
    const iw=CW-BPH*2,BD=22,BMAR=9,twW=iw-BD-BMAR;
    ctx.font=f(FS);
    let topCH=0;
    for(const k of["top1","top2","top3"]){
      const ls=wrapText(ctx,getV(k)||"",twW);
      topCH+=Math.max(1,ls.filter(l=>l).length)*LH+5;
    }
    const bh=bH(topCH);
    if(!measureOnly){
      drawBoxBg(LX,sY,CW,bh,false);drawPill(LX+BPH,sY+BPT,"好きなところ・魅力 TOP3",false);
      let ty=sY+BPT+PLH+PLMB;
      ["top1","top2","top3"].forEach((k,i)=>{
        const cx=LX+BPH+BD/2,cy=ty+BD/2;
        ctx.beginPath();ctx.arc(cx,cy,BD/2,0,Math.PI*2);
        ctx.fillStyle=C.mintPale;ctx.fill();
        ctx.font=f(13,true);ctx.fillStyle=C.mintDark;ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(String(i+1),cx,cy);
        ctx.font=f(FS);ctx.fillStyle=C.ink;ctx.textAlign="left";ctx.textBaseline="top";
        const tx=LX+BPH+BD+BMAR;
        const ls=wrapText(ctx,getV(k)||"",twW);
        if(!ls.filter(l=>l).length){ctx.fillStyle="#ccc";ctx.fillText("—",tx,ty);ty+=LH;}
        else{for(const l of ls){ctx.fillText(l,tx,ty);ty+=LH;}}
        ty+=5;
      });
    }
    sY+=bh+GAP;
  }
  // Row4: reason | episode
  {
    const iw=HALF-BPH*2;
    const rH=Math.max(bH(nLines(getV("reason"),iw,FS,false)*LH),bH(nLines(getV("episode"),iw,FS,false)*LH));
    if(!measureOnly){
      drawBoxBg(LX,sY,HALF,rH,false);drawPill(LX+BPH,sY+BPT,"好きになったきっかけ",false);
      drawTextBox(getV("reason"),LX+BPH,sY+BPT+PLH+PLMB,iw,FS);
      drawBoxBg(RX,sY,HALF,rH,false);drawPill(RX+BPH,sY+BPT,"印象的なエピソード",false);
      drawTextBox(getV("episode"),RX+BPH,sY+BPT+PLH+PLMB,iw,FS);
    }
    sY+=rH+GAP;
  }
  // Row5: recommend | love (accent)
  {
    const iw=HALF-BPH*2;
    const rH=Math.max(bH(nLines(getV("recommend"),iw,FS,false)*LH),bH(nLines(getV("love"),iw,FS,false)*LH));
    if(!measureOnly){
      drawBoxBg(LX,sY,HALF,rH,false);drawPill(LX+BPH,sY+BPT,"おすすめコンテンツ",false);
      drawTextBox(getV("recommend"),LX+BPH,sY+BPT+PLH+PLMB,iw,FS);
      drawBoxBg(RX,sY,HALF,rH,true);drawPill(RX+BPH,sY+BPT,"優羽さんへ愛を叫ぶ！",true);
      drawTextBox(getV("love"),RX+BPH,sY+BPT+PLH+PLMB,iw,FS,C.pinkDeep);
    }
    sY+=rH+GAP;
  }
  // Footer
  if(!measureOnly){
    ctx.font=f(13);ctx.fillStyle=C.muted;ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillText("♡ さとうゆほーむ ・ satoyu.info ♡",w/2,sY+4);
  }
  return sY+13+20;
}

// ════════════════════════════════════════════════════════
//  案5 ステッカー帳 描画エンジン
// ════════════════════════════════════════════════════════
function drawStickerSheet(ctx, w, getV, ico, measureOnly) {
  const PAD=16,GAP=11;
  const CW=w-PAD*2;
  const COL3=(CW-GAP*2)/3;
  const COL2=COL3*2+GAP;
  const TPH=13,TPV=13,TRAD=18;
  const FS=15,LH=Math.ceil(FS*1.55);
  const THDR=20;
  const C={
    mint:"#3DAA78",mintDark:"#1f7a52",mintPale:"#e6f4ec",
    pinkDeep:"#d8567f",pinkPale:"#fdeaf0",
    cream:"#fff6e0",creamDark:"#9a7b2e",ink:"#23332a",muted:"#5b6c63",white:"#ffffff",
  };
  const X3=[PAD,PAD+COL3+GAP,PAD+COL3*2+GAP*2];
  function f(sz,bold,fam){return`${bold?"600 ":""}${sz}px '${fam||"Klee One"}','Noto Sans JP',sans-serif`;}
  function nLines(text,iw){ctx.font=f(FS);const ls=wrapText(ctx,text||"",iw);return Math.max(1,ls.filter(l=>l!=="").length);}
  function tH(cH){return TPV+THDR+cH+TPV;}
  function drawTile(x,y,tw,th,bg){ctx.beginPath();ctx.roundRect(x,y,tw,th,TRAD);ctx.fillStyle=bg;ctx.fill();}
  function drawTHdr(x,y,emoji,label,lc){
    ctx.font=`14px sans-serif`;ctx.fillStyle=C.ink;ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(emoji,x,y+THDR/2);
    const ew=ctx.measureText(emoji).width;
    ctx.font=f(12,true);ctx.fillStyle=lc||C.mintDark;ctx.fillText(label,x+ew+6,y+THDR/2);
  }
  function drawTText(text,x,y,iw,color){
    ctx.font=f(FS);ctx.fillStyle=color||C.ink;ctx.textAlign="left";ctx.textBaseline="top";
    const ls=wrapText(ctx,text||"",iw);
    if(!ls.filter(l=>l).length){ctx.fillStyle="#ccc";ctx.fillText("—",x,y);return;}
    for(const l of ls){ctx.fillText(l,x,y);y+=LH;}
  }
  // Hero
  const IR=33,HDR_H=IR*2+36;
  if(!measureOnly){
    const g=ctx.createLinearGradient(0,0,w*0.9,HDR_H);
    g.addColorStop(0,C.mint);g.addColorStop(0.6,"#6fc79b");g.addColorStop(1,"#f7b6c8");
    ctx.fillStyle=g;ctx.fillRect(0,0,w,HDR_H);
    const IX=20+IR,IY=HDR_H/2;
    drawIconCircle(ctx,ico,IX,IY,IR,"#fff",4);
    const TX=IX+IR+16;
    ctx.font=f(22);ctx.fillStyle="#fff";ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(getV("fan-name")||"ファン名",TX,IY-15);
    const pills=[getV("handle")||"@handle","📅 推し歴 "+(getV("oshi-years")||"〇年目")];
    let px=TX;
    ctx.font=f(12.5,true);
    for(const p of pills){
      const pw=ctx.measureText(p).width+22;
      ctx.beginPath();ctx.roundRect(px,IY+3,pw,24,99);
      ctx.fillStyle="rgba(255,255,255,0.9)";ctx.fill();
      ctx.fillStyle=C.mintDark;ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillText(p,px+11,IY+15);px+=pw+8;
    }
    ctx.font=f(24,true,"Caveat");ctx.fillStyle="rgba(255,255,255,0.85)";
    ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText("♡ satoyu ♡",w-20,IY);
  }
  let sY=HDR_H+PAD;
  // Row1: TOP1/2/3
  {
    const iw=COL3-TPH*2,emj=["🥇","🥈","🥉"],lbls=["好きなところ #1","好きなところ #2","好きなところ #3"];
    const keys=["top1","top2","top3"];
    let maxH=0;
    for(const k of keys)maxH=Math.max(maxH,tH(nLines(getV(k),iw)*LH));
    if(!measureOnly){
      keys.forEach((k,i)=>{
        drawTile(X3[i],sY,COL3,maxH,C.mintPale);
        drawTHdr(X3[i]+TPH,sY+TPV,emj[i],lbls[i],C.mintDark);
        drawTText(getV(k),X3[i]+TPH,sY+TPV+THDR,iw);
      });
    }
    sY+=maxH+GAP;
  }
  // Row2: reason (3col)
  {
    const iw=CW-TPH*2,th=tH(nLines(getV("reason"),iw)*LH);
    if(!measureOnly){
      drawTile(PAD,sY,CW,th,C.cream);
      drawTHdr(PAD+TPH,sY+TPV,"🌱","好きになったきっかけ",C.mintDark);
      drawTText(getV("reason"),PAD+TPH,sY+TPV+THDR,iw);
    }
    sY+=th+GAP;
  }
  // Row3: episode (2col) + recommend (1col)
  {
    const eiw=COL2-TPH*2,riw=COL3-TPH*2;
    const eH=tH(nLines(getV("episode"),eiw)*LH),rH=tH(nLines(getV("recommend"),riw)*LH);
    const rowH=Math.max(eH,rH);
    if(!measureOnly){
      drawTile(PAD,sY,COL2,rowH,C.mintPale);
      drawTHdr(PAD+TPH,sY+TPV,"✨","印象的なエピソード",C.mintDark);
      drawTText(getV("episode"),PAD+TPH,sY+TPV+THDR,eiw);
      drawTile(X3[2],sY,COL3,rowH,C.cream);
      drawTHdr(X3[2]+TPH,sY+TPV,"📺","おすすめ",C.creamDark);
      drawTText(getV("recommend"),X3[2]+TPH,sY+TPV+THDR,riw);
    }
    sY+=rowH+GAP;
  }
  // Row4: love (3col)
  {
    const iw=CW-TPH*2,th=tH(nLines(getV("love"),iw)*LH);
    if(!measureOnly){
      drawTile(PAD,sY,CW,th,C.pinkPale);
      drawTHdr(PAD+TPH,sY+TPV,"💗","優羽さんへ愛を叫ぶ！",C.pinkDeep);
      drawTText(getV("love"),PAD+TPH,sY+TPV+THDR,iw,C.pinkDeep);
    }
    sY+=th+GAP;
  }
  // Footer
  if(!measureOnly){
    ctx.font=f(13);ctx.fillStyle=C.muted;ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillText("♡ さとうゆほーむ ・ satoyu.info ♡",w/2,sY+4);
  }
  return sY+13+20;
}

// ════════════════════════════════════════════════════════
//  案6 ノート見開き 描画エンジン
// ════════════════════════════════════════════════════════
function drawNotebook(ctx, w, getV, ico, measureOnly) {
  const BIND_W=30;
  const PW=(w-BIND_W)/2;  // 425
  const C={
    mintDark:"#1f7a52",mintPale:"#e6f4ec",pinkDeep:"#d8567f",
    ink:"#283a30",muted:"#6b7c72",white:"#ffffff",cream:"#fffdf7",
    line:"#e2ede6",bind:"#c9b78a",
  };
  function f(sz,bold,fam){return`${bold?"600 ":""}${sz}px '${fam||"Klee One"}','Noto Sans JP',sans-serif`;}
  function drawRuled(x,y,pw,ph){
    ctx.fillStyle=C.cream;ctx.fillRect(x,y,pw,ph);
    ctx.strokeStyle=C.line;ctx.lineWidth=1;
    for(let ly=y+31;ly<y+ph;ly+=31){ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+pw,ly);ctx.stroke();}
  }
  const PLH=20,PLMB=5,MINIMB=13,FSM=15,LHM=Math.ceil(FSM*1.65);
  function measureMiniH(text,iw,isTop3){
    if(isTop3){
      let h=0;
      for(let i=1;i<=3;i++){ctx.font=f(FSM);const ls=wrapText(ctx,getV(`top${i}`)||"",iw-35);h+=Math.max(1,ls.filter(l=>l).length)*LHM+3;}
      return PLH+PLMB+h+MINIMB;
    }
    ctx.font=f(FSM);const ls=wrapText(ctx,text||"",iw);
    return PLH+PLMB+Math.max(1,ls.filter(l=>l).length)*LHM+MINIMB;
  }
  function drawMini(x,y,iw,label,text,accent,isTop3){
    ctx.font=f(12,true);
    const pw=ctx.measureText(label).width+22;
    ctx.beginPath();ctx.roundRect(x,y,pw,PLH,99);
    ctx.fillStyle=accent?"#fde7ee":C.mintPale;ctx.fill();
    ctx.fillStyle=accent?C.pinkDeep:C.mintDark;
    ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(label,x+11,y+PLH/2);
    y+=PLH+PLMB;
    if(isTop3){
      for(let i=1;i<=3;i++){
        ctx.font=f(18,true,"Caveat");ctx.fillStyle=C.pinkDeep;ctx.textAlign="left";ctx.textBaseline="top";
        const pre=`0${i}.`;const pw2=ctx.measureText(pre).width+7;ctx.fillText(pre,x,y);
        ctx.font=f(FSM);ctx.fillStyle=C.ink;
        const ls=wrapText(ctx,getV(`top${i}`)||"",iw-pw2);
        if(!ls.filter(l=>l).length){ctx.fillStyle="#ccc";ctx.fillText("—",x+pw2,y);y+=LHM;}
        else{for(const l of ls){ctx.fillText(l,x+pw2,y);y+=LHM;}}y+=3;
      }
    } else {
      ctx.font=f(FSM);ctx.fillStyle=accent?C.pinkDeep:C.ink;ctx.textAlign="left";ctx.textBaseline="top";
      const ls=wrapText(ctx,text||"",iw);
      if(!ls.filter(l=>l).length){ctx.fillStyle="#ccc";ctx.fillText("—",x,y);}
      else{for(const l of ls){ctx.fillText(l,x,y);y+=LHM;}}
    }
  }
  // Layout constants
  const LPL=30,LPR=26,LPT=26,LPB=26;
  const LIW=PW-LPL-LPR;  // 369
  const ICO_D=72,ICO_R=ICO_D/2;
  const POL_P=6,POL_PB=18;
  const POL_W=POL_P*2+ICO_D;  // 84
  const POL_H=POL_P+ICO_D+2+21+POL_PB;  // ~119
  const PHOTO_GAP=14;
  const INFO_W=LIW-POL_W-PHOTO_GAP;
  const INFO_H=38+6+27+3+19;  // Caveat30 + name19 + handle13
  const PHOTO_ROW_H=Math.max(POL_H,INFO_H);
  const PHOTO_MB=16;
  const L_REASON_H=measureMiniH(getV("reason"),LIW,false);
  const L_TOP3_H=measureMiniH(null,LIW,true);
  const LEFT_H=LPT+PHOTO_ROW_H+PHOTO_MB+L_REASON_H+L_TOP3_H+LPB;
  const RPL=26,RPR=30,RPT=26,RPB=26;
  const RIW=PW-RPL-RPR;  // 369
  const MSG_H=38+12;
  const R_EP_H=measureMiniH(getV("episode"),RIW,false);
  const R_RC_H=measureMiniH(getV("recommend"),RIW,false);
  const R_LV_H=measureMiniH(getV("love"),RIW,false);
  const RIGHT_H=RPT+MSG_H+R_EP_H+R_RC_H+R_LV_H+28+RPB;
  const totalH=Math.max(LEFT_H,RIGHT_H);
  if(measureOnly)return totalH;
  // Draw pages
  drawRuled(0,0,PW,totalH);
  drawRuled(PW+BIND_W,0,PW,totalH);
  // Binding
  ctx.fillStyle="rgba(0,0,0,0.04)";ctx.fillRect(PW,0,BIND_W,totalH);
  const ringX=PW+BIND_W/2,numR=11,rSp=(totalH-32)/(numR-1);
  for(let i=0;i<numR;i++){
    const ry=16+i*rSp;
    ctx.beginPath();ctx.arc(ringX,ry,6,0,Math.PI*2);
    ctx.fillStyle=C.cream;ctx.fill();ctx.strokeStyle=C.bind;ctx.lineWidth=1.5;ctx.stroke();
  }
  // Left page - polaroid
  let lY=LPT;
  const polCX=LPL+POL_W/2,polCY=lY+PHOTO_ROW_H/2;
  ctx.save();
  ctx.translate(polCX,polCY);ctx.rotate(-3*Math.PI/180);ctx.translate(-POL_W/2,-POL_H/2);
  ctx.shadowColor="rgba(0,0,0,0.25)";ctx.shadowBlur=13;ctx.shadowOffsetY=5;
  ctx.fillStyle=C.white;ctx.fillRect(0,0,POL_W,POL_H);
  ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  drawIconCircle(ctx,ico,POL_W/2,POL_P+ICO_R,ICO_R,"#f2f2f2",0);
  ctx.font=f(17,false,"Caveat");ctx.fillStyle=C.muted;ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("my oshi ♡",POL_W/2,POL_P+ICO_D+2);
  ctx.restore();
  // Left page - fan info
  const infoX=LPL+POL_W+PHOTO_GAP;
  let iY=lY+(PHOTO_ROW_H-INFO_H)/2;
  ctx.font=f(30,true,"Caveat");ctx.fillStyle=C.mintDark;ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillText("satoyu fan ♡",infoX,iY);iY+=38+6;
  ctx.font=f(19,true);ctx.fillStyle=C.ink;ctx.fillText(getV("fan-name")||"ファン名",infoX,iY);iY+=27+3;
  const hi=[getV("handle"),getV("oshi-years")].filter(Boolean).join(" ・ ");
  ctx.font=f(13);ctx.fillStyle=C.muted;ctx.fillText(hi,infoX,iY);
  lY+=PHOTO_ROW_H+PHOTO_MB;
  drawMini(LPL,lY,LIW,"🌱 好きになったきっかけ",getV("reason"),false,false);lY+=L_REASON_H;
  drawMini(LPL,lY,LIW,"💚 好きなところ TOP3",null,false,true);
  // Right page
  const RPX=PW+BIND_W+RPL;
  let rY=RPT;
  ctx.font=f(26,true,"Caveat");ctx.fillStyle=C.pinkDeep;ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillText("message ♡",RPX,rY);rY+=38+12;
  drawMini(RPX,rY,RIW,"✨ 印象的なエピソード",getV("episode"),false,false);rY+=R_EP_H;
  drawMini(RPX,rY,RIW,"📺 おすすめコンテンツ",getV("recommend"),false,false);rY+=R_RC_H;
  drawMini(RPX,rY,RIW,"💗 優羽さんへ愛を叫ぶ！",getV("love"),true,false);
  ctx.font=f(12);ctx.fillStyle=C.muted;ctx.textAlign="right";ctx.textBaseline="bottom";
  ctx.fillText("♡ satoyu.info ♡",PW+BIND_W+PW-RPR,totalH-8);
  return totalH;
}

// ── 描画 ────────────────────────────────────────────────
const DRAW_FNS = {
  "profile-card": drawProfileCard,
  "booklet":      drawBooklet,
  "sticker":      drawStickerSheet,
  "notebook":     drawNotebook,
};

function render() {
  const tpl = TEMPLATES[tplIdx];
  canvas.width = tpl.w;

  if (tpl.customRender) {
    const draw = DRAW_FNS[tpl.id] || drawProfileCard;
    canvas.height = 9999;
    const totalH = draw(ctx, tpl.w, id => getVal(tpl, id), iconImg, true);
    canvas.height = totalH;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, tpl.w, totalH);
    draw(ctx, tpl.w, id => getVal(tpl, id), iconImg, false);
    document.getElementById("canvas-size-note").textContent =
      `出力サイズ: ${tpl.w} × ${totalH} px`;
  }
}

function loadBg() { render(); }

// ════════════════════════════════════════════════════════
//  UI 生成
// ════════════════════════════════════════════════════════

// ── テンプレートタブ ──────────────────────────────────
function buildTabs() {
  const container = document.getElementById("tpl-tabs");
  container.innerHTML = "";
  TEMPLATES.forEach((tpl, i) => {
    const btn = document.createElement("button");
    btn.className = "tpl-tab" + (i === tplIdx ? " active" : "");
    btn.textContent = tpl.name;
    btn.onclick = () => switchTemplate(i);
    container.appendChild(btn);
  });
}

// ── フィールドリスト ──────────────────────────────────
function buildFields() {
  const tpl = TEMPLATES[tplIdx];
  const container = document.getElementById("fields-list");
  container.innerHTML = "";

  tpl.fields.forEach((f, idx) => {
    const block = document.createElement("div");
    block.className = "field-block";

    const label = document.createElement("label");
    label.className = "field-label";
    label.textContent = f.label;
    label.htmlFor = `fi-${tpl.id}-${f.id}`;

    const el = f.multiline ? document.createElement("textarea") : document.createElement("input");
    el.id = `fi-${tpl.id}-${f.id}`;
    el.className = f.multiline ? "field-ta" : "field-input";
    el.placeholder = f.placeholder || "";
    el.value = getVal(tpl, f.id);
    if (!f.multiline) el.type = "text";
    el.addEventListener("input", e => {
      setVal(tpl, f.id, e.target.value);
      render();
    });

    block.appendChild(label);
    block.appendChild(el);

    if (idx < tpl.fields.length - 1) {
      const hr = document.createElement("hr");
      hr.className = "field-divider";
      block.appendChild(hr);
    }

    container.appendChild(block);
  });
}

// ── テンプレート切り替え ──────────────────────────────
function switchTemplate(idx) {
  tplIdx = idx;
  document.querySelectorAll(".tpl-tab").forEach((b, i) => b.classList.toggle("active", i === idx));
  buildFields();
  loadBg();
}

// ── アイコン画像アップロード ──────────────────────────
function initIconUpload() {
  const fileInput = document.getElementById("icon-file");
  const preview   = document.getElementById("icon-preview");
  const thumbWrap = document.getElementById("icon-thumb-wrap");
  const clearBtn  = document.getElementById("icon-clear-btn");

  fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        iconImg = img;
        preview.src = e.target.result;
        thumbWrap.classList.add("has-icon");
        clearBtn.style.display = "inline-block";
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    this.value = "";  // 同じファイルを再選択できるようにリセット
  });

  clearBtn.addEventListener("click", function () {
    iconImg = null;
    preview.src = "";
    thumbWrap.classList.remove("has-icon");
    clearBtn.style.display = "none";
    render();
  });
}

// ── 高解像度 Canvas 生成（ダウンロード・シェア共通）────
function buildHighResCanvas() {
  const tpl   = TEMPLATES[tplIdx];
  const SCALE = 2;
  const draw  = DRAW_FNS[tpl.id] || drawProfileCard;
  const getV  = id => getVal(tpl, id);

  const tmp = document.createElement("canvas");
  const tc  = tmp.getContext("2d");
  tmp.width  = tpl.w * SCALE;
  tmp.height = 9999;
  tc.scale(SCALE, SCALE);
  const totalH = draw(tc, tpl.w, getV, iconImg, true);

  tmp.height = totalH * SCALE;
  tc.scale(SCALE, SCALE);
  tc.fillStyle = "#ffffff";
  tc.fillRect(0, 0, tpl.w, totalH);
  draw(tc, tpl.w, getV, iconImg, false);

  const name = (getVal(tpl, "fan-name") || "card").replace(/[\s　]/g, "_");
  return { canvas: tmp, filename: `satoyu_profile_${name}.png` };
}

// ── ダウンロード（2倍解像度 PNG）────────────────────────
function download() {
  const { canvas, filename } = buildHighResCanvas();
  const a = document.createElement("a");
  a.download = filename;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

// ── X に投稿（モバイル: Web Share API ／ PC: DL + intent）
const TWEET_TEXT = "#さとうゆおしプロフィール\nhttps://satoyu.info";

async function shareToX() {
  const btn = document.getElementById("share-x-btn");
  btn.disabled = true;
  btn.textContent = "⏳ 準備中...";

  try {
    const { canvas, filename } = buildHighResCanvas();

    // モバイル: Web Share API でファイル共有を試みる
    if (navigator.canShare) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      const file = new File([blob], filename, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ text: TWEET_TEXT, files: [file] });
          return;
        } catch (e) {
          if (e.name === "AbortError") return; // ユーザーがキャンセル
          // その他のエラーはフォールバックへ
        }
      }
    }

    // PC フォールバック: 画像ダウンロード + X 投稿画面を開く
    const a = document.createElement("a");
    a.download = filename;
    a.href = canvas.toDataURL("image/png");
    a.click();

    const xUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(TWEET_TEXT);
    setTimeout(() => window.open(xUrl, "_blank", "width=600,height=500,noopener"), 600);
  } finally {
    btn.disabled = false;
    btn.textContent = "𝕏 Xに投稿する";
  }
}

// ════════════════════════════════════════════════════════
//  初期化
// ════════════════════════════════════════════════════════
document.fonts.ready.then(() => {
  buildTabs();
  switchTemplate(0);
  document.getElementById("download-btn").addEventListener("click", download);
  document.getElementById("share-x-btn").addEventListener("click", shareToX);
  initIconUpload();
});

// ── ハンバーガーメニュー ──────────────────────────────
(function () {
  const btn   = document.getElementById("hamburger");
  const links = document.getElementById("nav-links");
  if (!btn || !links) return;
  btn.addEventListener("click", function () {
    const open = links.classList.toggle("open");
    btn.textContent = open ? "✕" : "☰";
    btn.setAttribute("aria-label", open ? "メニューを閉じる" : "メニューを開く");
  });
  links.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", function () {
      links.classList.remove("open");
      btn.textContent = "☰";
      btn.setAttribute("aria-label", "メニューを開く");
    });
  });
})();
</script>
