name: Build & Deploy

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @notionhq/client@2.2.15 @anthropic-ai/sdk@0.39.0

      - name: Add new blog posts
        run: node add_blog_posts.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:      ${{ secrets.DB_BLOG }}

      - name: Update blog thumbnails
        run: node update_blog_thumbnails.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_BLOG:      ${{ secrets.DB_BLOG }}

      - name: Update YouTube/Lemino thumbnails & TikTok captions
        run: node update_media_thumbnails.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_YOUTUBE:   ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:    ${{ secrets.DB_LEMINO }}
          DB_YU_NEWS:   ${{ secrets.DB_YU_NEWS }}
          DB_TIKTOK:    ${{ secrets.DB_TIKTOK }}

      - name: Build all pages
        run: node build.js
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          DB_COMMITTEE_NEWS:   ${{ secrets.DB_COMMITTEE_NEWS }}
          DB_YU_NEWS:          ${{ secrets.DB_YU_NEWS }}
          DB_ACTIVITIES:       ${{ secrets.DB_ACTIVITIES }}
          DB_BLOG:             ${{ secrets.DB_BLOG }}
          DB_INTERVIEW:        ${{ secrets.DB_INTERVIEW }}
          DB_TIKTOK:           ${{ secrets.DB_TIKTOK }}
          DB_X:                ${{ secrets.DB_X }}
          DB_YOUTUBE:          ${{ secrets.DB_YOUTUBE }}
          DB_LEMINO:           ${{ secrets.DB_LEMINO }}
          DB_WEB:              ${{ secrets.DB_WEB }}
          DB_SCHEDULE:         ${{ secrets.DB_SCHEDULE }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (satoyu.info)
        run: |
          rsync -avz --delete \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='build.js' \
            --exclude='add_blog_posts.js' \
            --exclude='update_blog_thumbnails.js' \
            --exclude='update_media_thumbnails.js' \
            --exclude='download_media.js' \
            --exclude='update_notion_media.js' \
            --exclude='generate_quiz.js' \
            --exclude='reset_tiktok_yunews.js' \
            --exclude='deduplicate_yu_news.js' \
            --exclude='restore_tiktok.js' \
            --exclude='_template.html' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='.claude' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/satoyu/
